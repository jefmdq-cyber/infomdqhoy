<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página en Construcción | INFO MDQ HOY</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b1329;color:#f8fafc;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .top-bar{background:#0f172a;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;width:100%;z-index:20}
  .top-bar .logo{font-family:'Fredoka',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px}
  .top-bar .logo span{color:#38bdf8}
  .top-bar .back{background:#1e293b;border:1px solid #334155;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:800;color:#e2e8f0;text-decoration:none}
  .card{background:#1e293b;border:1px solid #334155;border-radius:24px;padding:40px 20px;max-width:500px;width:100%;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);margin-top:60px}
  .icon{font-size:48px;margin-bottom:16px;animation:flotar 3s ease-in-out infinite}
  h1{font-family:'Fredoka',sans-serif;font-size:26px;color:#38bdf8;margin-bottom:12px}
  p{color:#94a3b8;font-size:14px;line-height:1.5;margin-bottom:24px}
  .btn{display:inline-block;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;padding:12px 24px;border-radius:10px;font-weight:800;font-size:14px;text-decoration:none;transition:transform 0.2s}
  .btn:hover{transform:scale(1.03)}
  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="index.html" class="back">← Volver al Inicio</a>
    <div class="logo">INFO <span>MDQ HOY</span></div>
  </div>
</div>

<div class="card">
  <div class="icon">🛠️</div>
  <h1>Página en Construcción</h1>
  <p>Estamos trabajando y automatizando esta sección para traerte los resultados oficiales al instante. ¡Volvé a visitarnos pronto!</p>
  <a href="index.html" class="btn">Volver a la Página Principal</a>
</div>

</body>
</html>

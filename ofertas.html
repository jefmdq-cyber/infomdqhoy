<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas de Negocios | INFO MDQ SUR HOY</title>
<meta name="theme-color" content="#0f172a">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f0f4f8;color:#1a202c;padding-bottom:90px}
.hero{position:relative;height:200px;overflow:hidden;background:linear-gradient(135deg,#f59e0b,#ec4899)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,23,42,.85) 0%,rgba(0,0,0,.1) 60%)}
.hero-text{position:absolute;bottom:18px;left:16px;right:16px;color:white;z-index:2}
.hero-text h1{font-size:26px;font-weight:900;letter-spacing:-.8px;line-height:1.1}
.hero-text p{font-size:12.5px;opacity:.9;margin-top:5px}
.contenedor{max-width:1000px;margin:0 auto;padding:14px}
.buscador-wrap{position:sticky;top:0;z-index:20;background:#f0f4f8;padding:10px 0 8px 0;margin:0 0 12px 0}
.buscador{width:100%;padding:13px 16px 13px 44px;border-radius:999px;border:2px solid #0f172a;background:white;font-weight:700;font-size:13.5px;outline:none}
.buscador-wrap::before{content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:2;font-size:17px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:600px) and (max-width:899px){.grid{grid-template-columns:repeat(3,1fr)}}
.card-oferta{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #e2e8f0;text-align:left;transition:.15s;cursor:pointer;position:relative}
.card-oferta:hover{transform:translateY(-2px)}
.badge-oferta{position:absolute;top:7px;left:7px;z-index:2;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900;color:white}
.badge-reintegro{background:#16a34a}
.badge-oferta{background:#ef4444}
.img-box{width:100%;height:118px;background:#ffeb3b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img-box img{width:100%;height:100%;object-fit:contain;display:block;background:#ffeb3b}
.card-oferta-texto{background:#ffeb3b;border:2px solid #0f172a;border-radius:14px;padding:12px;position:relative;cursor:pointer;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.card-oferta-texto .promo-top{font-size:9px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.4px;padding-right:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-oferta-texto .promo-prod{font-size:11px;font-weight:900;color:#0f172a;margin-top:6px;line-height:1.2}
.card-oferta-texto .promo-mid{font-size:30px;font-weight:900;color:#dc2626;line-height:1;margin:6px 0}
.card-oferta-texto .promo-precio{font-size:18px;font-weight:900;color:#0f172a}
.badge-oferta-float{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900;color:white;background:#ef4444;z-index:2}
.info{padding:9px 10px 10px 10px;display:flex;flex-direction:column;gap:3px}
.info .negocio{font-size:9px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info h3{font-size:12px;font-weight:900;color:#0f172a;line-height:1.2;min-height:28px}
.info .desc{font-size:10px;color:#475569;line-height:1.3}
.info .vigencia{font-size:9px;color:#16a34a;font-weight:800;margin-top:2px}
.btn-ver{background:#0f172a;color:white;padding:7px 10px;border-radius:999px;text-align:center;font-weight:900;font-size:10px;margin-top:6px}
.filtros-global{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 0 14px 0}
@media(max-width:520px){.filtros-global{grid-template-columns:repeat(2,1fr)}}
.filtro{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 8px;border-radius:16px;border:1.5px solid #e2e8f0;background:white;font-weight:900;font-size:11px;cursor:pointer}
.filtro.activo{background:#0f172a;color:white;border-color:#0f172a}
.filtro .ico{font-size:20px}
#modalAviso{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modalAviso.activo{display:flex}
.modal-box{background:white;border-radius:20px;max-width:420px;width:100%;overflow:hidden;max-height:92vh;overflow-y:auto}
.modal-img{width:100%;height:auto;max-height:380px;object-fit:contain;background:#ffeb3b;display:block}
</style>
</head>
<body>
<div class="hero"><div class="hero-overlay"></div><div class="hero-text"><h1>🔥 OFERTAS DE NEGOCIOS</h1><p>Descuentos, reintegros y promos de la zona sur</p></div></div>
<div class="contenedor">
<div class="buscador-wrap"><input id="buscadorUnificado" class="buscador" placeholder="Buscar: farmacia vara, cuenta dni..."></div>
<div class="filtros-global">
<div class="filtro activo" data-filtro="todos"><span class="ico">🔥</span><span class="label">TODOS</span></div>
<div class="filtro" data-filtro="promociones"><span class="ico">🏷️</span><span class="label">PROMOCIONES</span></div>
<div class="filtro" data-filtro="reintegro"><span class="ico">💳</span><span class="label">REINTEGRO</span></div>
<div class="filtro" data-filtro="ofertas"><span class="ico">🎁</span><span class="label">OFERTAS</span></div>
</div>
<div class="grid" id="gridOfertas"></div>
</div>

<div id="modalAviso" onclick="if(event.target.id==='modalAviso') cerrarModal()">
<div class="modal-box">
<img id="modalImg" class="modal-img" src="" style="display:none">
<div style="padding:18px">
<div id="modalBarrio" style="font-size:10px;font-weight:900;color:#16a34a;letter-spacing:.4px"></div>
<h2 id="modalTitulo" style="font-size:17px;font-weight:900;margin:6px 0 8px 0;line-height:1.2"></h2>
<div id="modalDesc" style="font-size:13px;color:#334155;line-height:1.5"></div>
<button id="modalPrincipal" onclick="cargarFarmaciaDesdePrincipal()" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;background:#0f172a;color:white;padding:13px 18px;border-radius:999px;font-weight:900;font-size:14px;width:100%;border:none;cursor:pointer">Ver Farmacia Vara en página principal →</button>
<div id="farmaciaDesdePrincipal" style="display:none;margin-top:18px;border-top:2px solid #e2e8f0;padding-top:16px"></div>
<a id="linkIrPrincipal" href="index.html#farmacia-vara" style="display:none;text-align:center;margin-top:12px;font-size:12px;font-weight:800;color:#64748b;text-decoration:underline">Ir a la página principal de todos modos →</a>
<div style="text-align:center;margin-top:14px"><button onclick="cerrarModal()" style="background:#f1f5f9;border:2px solid #e2e8f0;padding:8px 18px;border-radius:999px;font-weight:800;font-size:11px;cursor:pointer">✕ Cerrar</button></div>
</div>
</div>
</div>

<script>
const OFERTAS = [
  {id:'farmacia-vara-cuenta-dni',nombre:'20% de ahorro en comercios de barrio',negocio:'FARMACIA VARA',tipo:'reintegro',barrio:'FARO - ALFAR • REINTEGRO • FARMACIA VARA',desc:'Farmacia Vara adherida a Cuenta DNI. 20% de ahorro en comercios de barrio. Tope $6.000 por semana y por persona.<br><br>Consultá condiciones en bancoprovincia.com.ar',vigencia:'Tope: $6.000 por semana y por persona',foto_web:'ofertas-comercio/descuentodni.webp',link_principal:'index.html#farmacia-vara'},
  {id:'farmacia-vara-excellence',nombre:'Tintura Capilar 25% OFF $19.500',negocio:'FARMACIA VARA',tipo:'ofertas',barrio:'FARO - ALFAR • OFERTA • FARMACIA VARA',desc:'EXCELLENCE Tintura Capilar<br>Variedad de tonos<br><br><b>25% OFF</b><br>Precio final: <b>$19.500</b><br><br>Imagen no contractual. Oferta válida hasta 31/10/2026 o hasta agotar stock.',vigencia:'Hasta 31/10/2026 o agotar stock',foto_web:null,promo_texto:'25% OFF',promo_precio:'$19.500',promo_producto:'EXCELLENCE Tintura',link_principal:'index.html#farmacia-vara'},
  {id:'farmacia-vara-nivea-solar',nombre:'Protector Solar 30% OFF $20.950',negocio:'FARMACIA VARA',tipo:'ofertas',barrio:'FARO - ALFAR • OFERTA • FARMACIA VARA',desc:'NIVEA Protector Solar<br>Protect & Hydrate FPS50 200ml<br><br><b>30% OFF</b><br>Precio final: <b>$20.950</b><br>Precio anterior: $29.928,57<br><br>Imagen no contractual. Oferta válida hasta 31/10/2026 o hasta agotar stock.',vigencia:'Hasta 31/10/2026 o agotar stock',foto_web:null,promo_texto:'30% OFF',promo_precio:'$20.950',promo_producto:'NIVEA Protector Solar',link_principal:'index.html#farmacia-vara'},
  {id:'farmacia-vara-closeup',nombre:'Pasta Dental 25% OFF $2.500',negocio:'FARMACIA VARA',tipo:'ofertas',barrio:'FARO - ALFAR • OFERTA • FARMACIA VARA',desc:'CLOSE-UP Pasta Dental<br>Triple Protección Menta x70g<br>Triple Protección Menta Americana x70g<br><br><b>25% OFF</b><br>Precio final: <b>$2.500</b><br><br>Imagen no contractual. Oferta válida hasta 31/10/2026 o hasta agotar stock.',vigencia:'Hasta 31/10/2026 o agotar stock',foto_web:null,promo_texto:'25% OFF',promo_precio:'$2.500',promo_producto:'CLOSE-UP x70g',link_principal:'index.html#farmacia-vara'},
  {id:'farmacia-vara-doncella',nombre:'Protectores Diarios 30% OFF $1.000',negocio:'FARMACIA VARA',tipo:'ofertas',barrio:'FARO - ALFAR • OFERTA • FARMACIA VARA',desc:'DONCELLA Protectores Diarios<br>Respirables S/Desodorante x20u<br>Respirables C/Desodorante x20u<br><br><b>30% OFF</b><br>Precio final: <b>$1.000</b><br><br>Imagen no contractual. Oferta válida hasta 31/10/2026 o hasta agotar stock.',vigencia:'Hasta 31/10/2026 o agotar stock',foto_web:null,promo_texto:'30% OFF',promo_precio:'$1.000',promo_producto:'DONCELLA x20u',link_principal:'index.html#farmacia-vara'}
];

function crearCard(o){
  if(o.foto_web){
    return `<div class="card-oferta" data-tipo="${o.tipo}" onclick="abrirModal('${o.id}')"><div class="badge-oferta badge-reintegro">REINTEGRO</div><div class="img-box"><img src="${o.foto_web}" loading="lazy" alt="${o.negocio}"></div><div class="info"><div class="negocio">${o.negocio}</div><h3>${o.nombre}</h3><div class="desc">FARMACIA VARA - Cuenta DNI</div><div class="vigencia">${o.vigencia}</div><div class="btn-ver">Ver reintegro →</div></div></div>`;
  } else {
    return `<div class="card-oferta-texto" data-tipo="${o.tipo}" onclick="abrirModal('${o.id}')"><div class="badge-oferta-float">OFERTA</div><div><div class="promo-top">${o.negocio}</div><div class="promo-prod">${o.promo_producto}</div><div class="promo-mid">${o.promo_texto}</div><div class="promo-precio">${o.promo_precio}</div></div><div><div style="font-size:11px;font-weight:800;color:#0f172a;margin-top:8px;line-height:1.2">${o.nombre}</div><div style="font-size:9px;color:#15803d;font-weight:800;margin-top:3px">${o.vigencia}</div><div class="btn-ver" style="margin-top:8px">Ver oferta →</div></div></div>`;
  }
}

function renderGrid(lista){document.getElementById('gridOfertas').innerHTML=lista.map(crearCard).join('');}
renderGrid(OFERTAS);

document.querySelectorAll('.filtro').forEach(f=>{
  f.addEventListener('click',()=>{
    document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('activo'));
    f.classList.add('activo');
    const tipo=f.dataset.filtro;
    if(tipo==='todos') renderGrid(OFERTAS);
    else renderGrid(OFERTAS.filter(o=>o.tipo===tipo));
  });
});

function abrirModal(id){
  const o=OFERTAS.find(x=>x.id===id); if(!o) return;
  const img=document.getElementById('modalImg');
  if(o.foto_web){ img.src=o.foto_web; img.style.display='block'; } else { img.style.display='none'; }
  document.getElementById('modalBarrio').innerText=o.barrio;
  document.getElementById('modalTitulo').innerText=o.nombre;
  document.getElementById('modalDesc').innerHTML=`<b>${o.negocio}</b><br><br>${o.desc}<br><br><small>${o.vigencia}</small>`;
  document.getElementById('farmaciaDesdePrincipal').style.display='none';
  document.getElementById('farmaciaDesdePrincipal').innerHTML='';
  document.getElementById('linkIrPrincipal').style.display='none';
  const btn=document.getElementById('modalPrincipal');
  btn.style.display='flex';
  btn.innerText='Ver Farmacia Vara en página principal →';
  btn.disabled=false;
  document.getElementById('modalAviso').classList.add('activo');
}

async function cargarFarmaciaDesdePrincipal(){
  const btn=document.getElementById('modalPrincipal');
  const cont=document.getElementById('farmaciaDesdePrincipal');
  const linkIr=document.getElementById('linkIrPrincipal');
  btn.innerText='Cargando aviso original...';
  btn.disabled=true;
  try{
    let htmlText=null;
    // probar rutas en minúscula como tenés vos
    const rutas=['index.html','./index.html','./INDEX.HTML','/index.html'];
    for(const r of rutas){
      try{
        const res=await fetch(r+'?v='+Date.now());
        if(res.ok){ htmlText=await res.text(); if(htmlText.toLowerCase().includes('farmacia vara')) break; }
      }catch(e){}
    }
    if(!htmlText) throw new Error('no se pudo fetch index.html');
    const parser=new DOMParser();
    const doc=parser.parseFromString(htmlText,'text/html');
    const modal=doc.getElementById('modal-farmacia');
    if(!modal) throw new Error('modal-farmacia no encontrado');
    // clonar el contenido interno del modal
    const innerBox=modal.querySelector('div');
    let clonHTML = innerBox ? innerBox.outerHTML : modal.innerHTML;
    // hacerlo visible y sin display:none
    clonHTML = clonHTML.replace(/display:\s*none/gi,'display:block');
    cont.innerHTML='<div style="background:white;border-radius:16px;border:2px solid #14532d;overflow:hidden">'+clonHTML+'</div>';
    cont.style.display='block';
    btn.style.display='none';
    linkIr.style.display='block';
    linkIr.href='index.html#farmacia-vara';
    cont.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){
    console.error(err);
    cont.innerHTML='<div style="padding:14px;background:#fef2f2;border-radius:12px;color:#991b1b;font-size:13px;line-height:1.4">No se pudo cargar el aviso desde index.html en VS Code.<br><br>En VS Code Live Server asegurate de abrir la carpeta donde están <b>index.html</b> y <b>ofertas.html</b> juntos en minúscula, y abrir ofertas.html desde el Live Server (no con file://).<br><br><a href="index.html#farmacia-vara" style="color:#0f172a;font-weight:900">→ Ir a la página principal</a></div>';
    cont.style.display='block';
    btn.innerText='Reintentar cargar aviso →';
    btn.disabled=false;
    linkIr.style.display='block';
  }
}

function cerrarModal(){document.getElementById('modalAviso').classList.remove('activo');}
</script>
</body>
</html>

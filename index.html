<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFO MDQ HOY | Dólar, Quiniela y Empleos Mar del Plata</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f0f4f8;color:#1a202c}
.hero{position:relative;height:320px;overflow:hidden;background:#0f172a}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1s ease}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,23,42,.95) 0%,rgba(0,0,0,.2) 60%)}
.hero-text{position:absolute;bottom:18px;left:16px;right:16px;color:white;z-index:2}
.hero-text h1{font-size:36px;font-weight:900;letter-spacing:-1px}
.container{max-width:520px;margin:0 auto;padding:14px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.06);border:1px solid #e2e8f0}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.dolar-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dolar-item{background:#f8fafc;border-radius:12px;padding:14px;text-align:center;border:2px solid #e2e8f0}
.dolar-item.blue{background:#eff6ff;border-color:#3b82f6}
.q-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.q-tab{white-space:nowrap;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;border:2px solid #e2e8f0;background:white;cursor:pointer}
.q-tab.active{background:#1e40af;color:white;border-color:#1e40af}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.q-box{background:white;border:2px solid #1e293b;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 0 #1e293b;cursor:pointer;min-height:70px;display:flex;flex-direction:column;justify-content:center}
.q-box b{font-size:20px;font-weight:900;color:#0f172a;letter-spacing:1px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:999;align-items:center;justify-content:center;padding:18px}
#modal.active{display:flex}
.modal-box{background:white;border-radius:20px;padding:22px;max-width:420px;width:100%;max-height:85vh;overflow:auto;position:relative;border:3px solid #0f172a}
.close-x{position:absolute;top:10px;right:12px;font-size:26px;font-weight:900;cursor:pointer;background:#0f172a;color:white;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.quiniela-list{display:grid;grid-template-columns:60px 1fr;gap:8px;margin-top:14px}
.q-pos{background:#f1f5f9;border:2px solid #cbd5e1;border-radius:8px;padding:6px;text-align:center;font-weight:900;font-size:13px}
.q-num{background:white;border:2px solid #0f172a;border-radius:8px;padding:6px 10px;font-weight:900;font-size:18px;letter-spacing:1px}
.q-num.cabeza{background:#dc2626;color:white;border-color:#991b1b;box-shadow:0 2px 0 #991b1b;font-size:22px}
.q-pos.cabeza{background:#dc2626;color:white;border-color:#991b1b}
.footer{padding:20px;text-align:center}
.footer a{color:#64748b;text-decoration:none;margin:0 6px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="hero">
<div style="position:absolute;inset:0;background:#0f172a"></div>
<div class="hero-overlay"></div>
<div class="hero-text"><h1>INFO MDQ HOY</h1><p>Mar del Plata - Dólar, Quiniela, Clima y Empleos - <span id="f"></span></p></div>
</div>
<div class="container">
<div class="card"><span class="badge" style="background:#dcfce7;color:#15803d">QUINIELA COMPLETA 20 NÚMEROS</span><h2 style="margin-top:6px;font-size:18px" id="q-titulo">Quiniela Hoy - 6 Loterías</h2><select id="q-fecha" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:2px solid #e2e8f0;font-weight:700;font-size:13px;background:white;color:#1e293b"></select><div class="q-tabs" id="qt" style="margin-top:10px"></div><div class="q-grid" id="qg"></div><a href="#" class="btn-outline" id="btn-ver" onclick="openM();return false" style="display:block;background:white;color:#1e40af;border:2px solid #1e40af;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;margin-top:8px">Ver 20 números de <span id="qn">Nacional</span></a><p id="info-uy" style="display:none;font-size:11px;color:#15803d;font-weight:700;margin-top:8px">🇺🇾 Uruguay solo tiene 2 sorteos: 15:00 y 21:00</p></div>
</div>
<div id="modal" onclick="closeM()"><div class="modal-box" onclick="event.stopPropagation()"><span class="close-x" onclick="closeM()">×</span><h3 id="mt" style="padding-right:30px;font-size:18px"></h3><div id="ml" class="quiniela-list"></div></div></div>
<script>
document.getElementById('f').textContent=new Date().toLocaleDateString('es-AR');
let todas={Nacional:[],Provincia:[],SantaFe:[],Cordoba:[],EntreRios:[],Uruguay:[]};
let datosCompletos=null;
const horsARG=["Previa 10:15","Primera 12:00","Matutina 15:00","Vespertina 18:00","Nocturna 21:00"];
const horsUY=["Vespertina 15:00","Nocturna 21:00"];
let actual="Nacional";
let actualSorteo="nocturna";
function getHors(){ return actual==="Uruguay"? horsUY : horsARG; }
function getListaSorteos(){ return actual==="Uruguay"? ["vespertina","nocturna"] : ["previa","primera","matutina","vespertina","nocturna"]; }
function renderT(){document.getElementById('qt').innerHTML=Object.keys(todas).map(k=>`<div class="q-tab ${k===actual?'active':''}" onclick="actual='${k}';render()">${k}</div>`).join('');}
function render(){
 renderT();
 document.getElementById('qn').textContent=actual;
 document.getElementById('info-uy').style.display = actual==="Uruguay"? 'block' : 'none';
 let hors = getHors();
 let listaIds = getListaSorteos();
 document.getElementById('qg').innerHTML=hors.map((h,i)=>{
   let idSorteo = listaIds[i];
   let key = actual.toLowerCase();
   let nums = (datosCompletos && datosCompletos[key] && datosCompletos[key][idSorteo])? datosCompletos[key][idSorteo] : [];
   let esVacio =!nums || nums.length < 5;
   let contenido = esVacio? `<b style="color:#94a3b8">---</b><div style="font-size:10px;color:#94a3b8;font-weight:700">Aún no sale</div>` : `<b>${nums[0]}</b>`;
   return `<div class="q-box" onclick="actualSorteo='${idSorteo}';openM()"><div style="font-size:11px;color:#64748b;font-weight:700">${h}</div>${contenido}</div>`;
 }).join('');
}
function openM(){
 document.getElementById('modal').classList.add('active');
 let key = actual.toLowerCase();
 let arr = (datosCompletos && datosCompletos[key] && datosCompletos[key][actualSorteo])? datosCompletos[key][actualSorteo] : [];
 document.getElementById('mt').textContent=actual+' - '+actualSorteo.toUpperCase()+' - 20 números';
 document.getElementById('ml').innerHTML=arr.length? arr.map((n,i)=>i===0?`<b class="q-pos cabeza">1°</b><span class="q-num cabeza">${n}</span>`:`<b class="q-pos">${i+1}°</b><span class="q-num">${n}</span>`).join('') : "<div style='padding:12px;background:#f1f5f9;border-radius:10px'>Aún sin datos para este sorteo - quedará en blanco hasta que salga</div>";
}
function closeM(){document.getElementById('modal').classList.remove('active');}
render();
function fechaARG(offsetDias){
  const ahora = new Date();
  const partes = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(ahora);
  const obj = {}; partes.forEach(p=>obj[p.type]=p.value);
  const base = new Date(Date.UTC(obj.year, obj.month-1, obj.day));
  base.setUTCDate(base.getUTCDate()+offsetDias);
  return base.toISOString().slice(0,10);
}
function etiquetaFecha(offsetDias, fechaStr){
  if(offsetDias===0) return 'Hoy - '+fechaStr.split('-').reverse().slice(0,2).join('/');
  if(offsetDias===-1) return 'Ayer - '+fechaStr.split('-').reverse().slice(0,2).join('/');
  const [y,m,d] = fechaStr.split('-');
  return `${d}/${m}/${y}`;
}
const selectFecha = document.getElementById('q-fecha');
for(let i=0;i>=-29;i--){
  const f = fechaARG(i);
  const opt = document.createElement('option');
  opt.value = f;
  opt.textContent = etiquetaFecha(i, f);
  selectFecha.appendChild(opt);
}
selectFecha.value = fechaARG(0);
selectFecha.addEventListener('change', ()=> cargarDia(selectFecha.value));
function cargarDia(fecha){
  const esHoy = fecha === fechaARG(0);
  document.getElementById('q-titulo').textContent = esHoy? 'Quiniela Hoy - 6 Loterías' : 'Quiniela del '+fecha.split('-').reverse().join('/');
  const ruta = esHoy? 'quiniela.json' : `historial/${fecha}.json`;
  fetch(ruta+'?v='+Date.now())
 .then(r=>{
    if(!r.ok) throw new Error(esHoy? "quiniela.json no encontrado" : "Sin datos guardados para "+fecha+" - revisá historial/"+fecha+".json");
    return r.json();
  })
 .then(raw=>{
    let d = Array.isArray(raw)? raw[0] : raw;
    let fuente = d.completo || d;
    let norm = {};
    Object.keys(fuente).forEach(k=>{ norm[k.toLowerCase()] = fuente[k]; });
    datosCompletos = norm;
    render();
  })
 .catch(e=>{
    console.error(e);
    datosCompletos = null;
    document.getElementById('qg').innerHTML = `<div style="grid-column:1/-1;background:#fee2e2;border:2px solid #dc2626;padding:12px;border-radius:10px;color:#991b1b;font-size:12px"><b>${e.message}</b></div>`;
  });
}
cargarDia(selectFecha.value);
</script>
</body>
</html>

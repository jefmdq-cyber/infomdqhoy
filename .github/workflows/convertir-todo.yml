name: Convertir a WEBP (fotos si, logos no)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  convertir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar webp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convertir JPG a WEBP (sin tocar logos ni webp existentes)
        run: |
          find. -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) \
           ! -path "./.git/*"! -path "./.github/*" \
           ! -iname "*logo*"! -iname "*Logo*" | while read file; do
              webp="${file%.*}.webp"
              if [! -f "$webp" ]; then
                echo "Convirtiendo $file -> $webp"
                cwebp -q 75 "$file" -o "$webp"
              else
                echo "Ya existe $webp, lo salteo"
              fi
          done

      - name: Actualizar HTML para usar webp donde ya existe
        run: |
          # Solo cambia jpg->webp si el webp existe
          find. -type f -name "*.html" | while read html; do
            # busca todos los jpg en el html y si existe su webp lo reemplaza
            grep -oE '[^"]+\.jpe?g' "$html" | sort -u | while read jpg; do
              webp="${jpg%.jpg}.webp"
              webp="${webp%.jpeg}.webp"
              if [ -f "./$webp" ] || [ -f "$webp" ]; then
                echo "En $html: $jpg -> $webp"
                sed -i "s|$jpg|$webp|g" "$html"
              fi
            done
          done

      - name: Subir cambios
        run: |
          git config user.name "webp-bot"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat: fotos a webp, logos intactos [skip ci]"
          git push

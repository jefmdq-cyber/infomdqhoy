name: Cortes EDEA
on:
  schedule:
    # Corre exactamente 2 veces al día: a las 08:00 AM y a las 18:00 PM (Hora UTC)
    - cron: '0 8,18 * * *'
  workflow_dispatch:
jobs:
  edea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4
      - run: |
          python - << 'PY'
          import requests, json
          from bs4 import BeautifulSoup
          from datetime import datetime
          
          url = "https://edeaweb.com.ar/obras-en-tu-barrio/"
          r = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30)
          soup = BeautifulSoup(r.text, "html.parser")
          
          # agarra todo el texto tal cual lo pone EDEA
          contenido = soup.find("main") or soup.find("article") or soup
          texto_limpio = contenido.get_text("\n", strip=True)
          
          # lo cortamos para que no traiga menúes
          if "obras en tu barrio" in texto_limpio.lower():
              texto_limpio = texto_limpio.lower().split("obras en tu barrio")[-1]
          
          # lo dejamos prolijo en líneas
          lineas = [l.strip() for l in texto_limpio.split("\n") if len(l.strip()) > 15]
          lineas = lineas[:50]  # primeras 50 lineas, es todo
          
          data = {
            "actualizado": datetime.now().strftime("%d/%m/%Y %H:%M"),
            "fuente": url,
            "info_oficial": "\n".join(lineas)
          }
          
          with open("cortes-edea.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@infomdq.com"
          git add cortes-edea.json || true
          git commit -m "Update EDEA oficial" || true
          git push

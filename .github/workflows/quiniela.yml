name: Actualiza Quiniela cada 15 min
on:
  schedule:
    - cron: '30,45 13 * * *'
    - cron: '0,15,30 14 * * *'
    - cron: '0,15,30,45 15 * * *'
    - cron: '0 16 * * *'
    - cron: '30,45 17 * * *'
    - cron: '0,15,30 18 * * *'
    - cron: '30,45 20 * * *'
    - cron: '0,15,30 21 * * *'
    - cron: '0,15,30,45 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: |
          python - << 'PY'
          import requests, re, json
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, timedelta

          url = "https://www.jugandoonline.com.ar/SorteosQuiniela3.aspx"
          try:
              html = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text
          except Exception as e:
              print(f"Error bajando pagina: {e}")
              exit(0)

          soup = BeautifulSoup(html, "lxml")
          texto = soup.get_text(" ", strip=True)

          def sacar_numeros(bloque):
              nums = re.findall(r'\b\d{3,4}\b', bloque)
              res = []
              for n in nums:
                  if len(n) >= 3 and n not in ["10","30","12","00","14","15","18","20","21","30"]:
                      res.append(n.zfill(4))
                  if len(res) == 20:
                      break
              return res

          def extraer(ciudad_pat, turno_pat):
              pat = rf"{ciudad_pat}.*?{turno_pat}"
              m = re.search(pat, texto, re.I)
              if not m:
                  print(f"No encontre {ciudad_pat} {turno_pat}")
                  return []
              inicio = m.end()
              bloque = texto[inicio:inicio+2000]
              numeros = sacar_numeros(bloque)
              return numeros

          # Cargar viejo
          with open("quiniela.json","r",encoding="utf-8") as f:
              viejo = json.load(f)

          nuevo = {}
          nuevo["nacional_previa"] = extraer(r"Ciudad", r"Previa")
          nuevo["nacional_primera"] = extraer(r"Ciudad", r"Primera")
          nuevo["nacional_matutina"] = extraer(r"Ciudad", r"Matutina")
          nuevo["nacional_vespertina"] = extraer(r"Ciudad", r"Vespertina")
          nuevo["nacional_nocturna"] = extraer(r"Ciudad", r"Nocturna")

          nuevo["provincia_previa"] = extraer(r"Prov", r"Previa")
          nuevo["provincia_primera"] = extraer(r"Prov", r"Primera")
          nuevo["provincia_matutina"] = extraer(r"Prov", r"Matutina")
          nuevo["provincia_vespertina"] = extraer(r"Prov", r"Vespertina")
          nuevo["provincia_nocturna"] = extraer(r"Prov", r"Nocturna")

          # Hora Argentina UTC-3
          ahora = datetime.now(timezone.utc) - timedelta(hours=3)
          viejo["fecha"] = ahora.strftime("%d/%m/%Y")
          viejo["actualizado"] = ahora.strftime("%H:%M")

          actualizados = 0
          for k,v in nuevo.items():
              if v and len(v) >= 10:
                  viejo[k] = v
                  print(f"OK {k}: {v[0]}...")
                  actualizados += 1

          for turno in ["nocturna","vespertina","matutina","primera","previa"]:
              if viejo.get(f"nacional_{turno}"):
                  viejo["nacional"] = viejo[f"nacional_{turno}"]
                  viejo["provincia"] = viejo.get(f"provincia_{turno}", viejo.get("provincia"))
                  break

          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(viejo, f, ensure_ascii=False, indent=2)

          print(f"Total actualizados: {actualizados}")
          PY
      - run: |
          git config user.name "robot-quiniela"
          git config user.email "robot@infomdq.com"
          git add quiniela.json
          git commit -m "quiniela auto" || echo "sin cambios"
          git push

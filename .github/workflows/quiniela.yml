name: Quiniela 20 TODOS los sorteos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear Quinielas Estricto
        run: |
          pip install requests beautifulsoup4 lxml pytz
          python << 'PY'
          import requests, json, os, re
          from datetime import datetime
          from bs4 import BeautifulSoup
          import pytz

          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36"}
          
          # Loterías y sus nombres clave en las tablas
          LOTERIAS = {
              "nacional": ["ciudad", "nacional"],
              "provincia": ["provincia", "buenos aires"],
              "santafe": ["santa fe"],
              "cordoba": ["cordoba", "córdoba"],
              "entrerios": ["entre rios", "entre ríos"],
              "uruguay": ["uruguay", "montevideo"]
          }

          ORDEN_ARG = ["previa", "primera", "matutina", "vespertina", "nocturna"]
          ORDEN_UY = ["vespertina", "nocturna"]

          # Cargar datos anteriores para PRESERVAR sorteos que ya salieron hoy
          viejo = {}
          if os.path.exists("quiniela.json"):
              try:
                  with open("quiniela.json", "r", encoding="utf-8") as f:
                      viejo = json.load(f).get("completo", {})
              except Exception:
                  pass

          tz_arg = pytz.timezone('America/Argentina/Buenos_Aires')
          completo = {lot: {s: [] for s in (ORDEN_UY if lot == "uruguay" else ORDEN_ARG)} for lot in LOTERIAS}

          try:
              # Scrapeamos directamente las tablas de Tujugada
              urls = {
                  "nacional": "https://www.tujugada.com.ar/resultados-quiniela-nacional.asp",
                  "provincia": "https://www.tujugada.com.ar/resultados-quiniela-provincia.asp",
                  "santafe": "https://www.tujugada.com.ar/resultados-quiniela-santa-fe.asp",
                  "cordoba": "https://www.tujugada.com.ar/resultados-quiniela-cordoba.asp",
                  "entrerios": "https://www.tujugada.com.ar/resultados-quiniela-entre-rios.asp",
                  "uruguay": "https://www.tujugada.com.ar/resultados-quiniela-montevideo.asp"
              }

              for lot_key, url in urls.items():
                  r = requests.get(url, headers=HEADERS, timeout=15)
                  if r.status_code != 200:
                      continue

                  soup = BeautifulSoup(r.text, "lxml")
                  
                  # Buscamos todas las tablas HTML
                  tablas = soup.find_all("table")
                  
                  for tabla in tablas:
                      txt_tabla = tabla.get_text().lower()
                      
                      # Identificar sorteo
                      sorteo_actual = None
                      sorteos_disponibles = ORDEN_UY if lot_key == "uruguay" else ORDEN_ARG
                      for s in sorteos_disponibles:
                          if s in txt_tabla:
                              sorteo_actual = s
                              break
                      
                      if not sorteo_actual:
                          continue

                      # Mapear exactamente celdas con Par (Posición, Número)
                      posiciones = {}
                      filas = tabla.find_all("tr")
                      for fila in filas:
                          cols = [c.get_text(strip=True) for c in fila.find_all(["td", "th"])]
                          # Si la fila tiene celdas tipo ["1°", "4521", "11°", "8820"]
                          for i in range(len(cols) - 1):
                              p_match = re.search(r'^([1-9]|1[0-9]|20)[º°\.]?$', cols[i])
                              n_match = re.search(r'^\d{3,4}$', cols[i+1])
                              
                              if p_match and n_match:
                                  pos = int(p_match.group(1))
                                  num = n_match.group(0)
                                  if pos not in posiciones:
                                      posiciones[pos] = num

                      # SI CONSEGUIMOS LOS 20 NÚMEROS, GUARDAMOS LISTA ORDENADA
                      if len(posiciones) == 20:
                          lista_ordenada = [posiciones[i] for i in range(1, 21)]
                          completo[lot_key][sorteo_actual] = lista_ordenada

          except Exception as e:
              print(f"Error procesando scraper: {e}")

          # REGLA DE ORO: Si un sorteo no salió o dio error, mantener el histórico guardado
          for lot, sorteos in completo.items():
              for s, nums in sorteos.items():
                  if not nums or len(nums) < 20:
                      if viejo.get(lot, {}).get(s) and len(viejo[lot][s]) == 20:
                          completo[lot][s] = viejo[lot][s]

          output = {
              "actualizado": datetime.now(tz_arg).strftime("%d/%m/%Y %H:%M"),
              "completo": completo,
              "nacional":  completo["nacional"].get("nocturna", []),
              "provincia": completo["provincia"].get("nocturna", []),
              "santafe":   completo["santafe"].get("nocturna", []),
              "cordoba":   completo["cordoba"].get("nocturna", []),
              "entrerios": completo["entrerios"].get("nocturna", []),
              "uruguay":   completo["uruguay"].get("nocturna", []),
          }

          with open("quiniela.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("OK: quiniela.json generado con éxito en orden estricto del 1 al 20.")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FIX: Parsing estricto de tablas + Preservación de sorteos"
          file_pattern: quiniela.json

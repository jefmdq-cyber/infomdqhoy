name: Actualizar Quiniela

on:
  schedule:
    - cron: '15 1,11,13,16,19,22 * * *' # 10:15, 12:00, 15:00, 18:00, 21:00, 23:00 Arg
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml

      - name: Scrapear quiniela
        run: |
          python - << 'PY'
          import requests, json, re
          from bs4 import BeautifulSoup
          from datetime import datetime

          URL = "https://www.tujugada.com.ar/"
          headers = {"User-Agent": "Mozilla/5.0"}

          r = requests.get(URL, headers=headers, timeout=30)
          soup = BeautifulSoup(r.text, "lxml")

          # función que limpia el texto trampa: "---MENSAJE 899" -> "0899"
          def limpia_num(txt):
              if not txt: return None
              # busca los últimos 3 o 4 dígitos
              m = re.findall(r'(\d{3,4})', txt)
              if not m:
                  return None
              num = m[-1]
              return num.zfill(4)

          datos = {}
          # Cada tabla es una lotería
          # En TuJugada están en orden: Nacional, Provincia, Santa Fe, Cordoba, Entre Rios, Montevideo
          loterias_map = {
              "nacional": "Nacional",
              "provincia": "Provincia",
              "santa fe": "SantaFe",
              "cordoba": "Cordoba",
              "entre rios": "EntreRios",
              "montevideo": "Uruguay",
              "uruguay": "Uruguay"
          }

          for tabla in soup.find_all("table"):
              titulo_prev = tabla.find_previous("h2") or tabla.find_previous("h3") or tabla.find_previous("b")
              if not titulo_prev:
                  continue
              titulo = titulo_prev.get_text(strip=True).lower()

              loteria_key = None
              for k,v in loterias_map.items():
                  if k in titulo:
                      loteria_key = v
                      break
              if not loteria_key:
                  continue

              # sorteos dentro de la tabla
              sorteos = {"previa":[], "primera":[], "matutina":[], "vespertina":[], "nocturna":[]}

              filas = tabla.find_all("tr")
              sorteo_actual = "nocturna"
              for tr in filas:
                  txt = tr.get_text(" ", strip=True).lower()
                  if "previa" in txt: sorteo_actual="previa"
                  elif "primera" in txt: sorteo_actual="primera"
                  elif "matutina" in txt: sorteo_actual="matutina"
                  elif "vespertina" in txt: sorteo_actual="vespertina"
                  elif "nocturna" in txt: sorteo_actual="nocturna"

                  tds = tr.find_all("td")
                  if len(tds)>=2:
                      # el segundo td suele tener el número
                      num_txt = tds[1].get_text(" ", strip=True)
                      num = limpia_num(num_txt)
                      if num and num.isdigit() and len(sorteos[sorteo_actual])<20:
                          sorteos[sorteo_actual].append(num)

              # guardamos solo si tiene algo
              if any(len(v)>0 for v in sorteos.values()):
                  # si no hay sorteo separado, lo dejamos como lista plana para compatibilidad vieja
                  if loteria_key not in datos:
                      datos[loteria_key] = sorteos
                  else:
                      # merge
                      for k,v in sorteos.items():
                          if v:
                              datos[loteria_key][k]=v

          # Estructura final compatible con tu index
          final = {
              "actualizado": datetime.now().isoformat(),
              "completo": datos
          }
          # también dejamos formato viejo plano (Nacional = últimos 20 nocturna)
          for lot, sorts in datos.items():
              if sorts.get("nocturna"):
                  final[lot] = sorts["nocturna"]
              elif sorts.get("vespertina"):
                  final[lot] = sorts["vespertina"]

          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(final,f,ensure_ascii=False,indent=2)

          print(json.dumps(final,indent=2)[:3000])
          PY

      - name: Guardar json
        run: |
          git config user.name "bot"
          git config user.email "bot@infomdqhoy.com"
          git add quiniela.json
          git diff --staged --quiet || git commit -m "update quiniela $(date -u)"
          git push

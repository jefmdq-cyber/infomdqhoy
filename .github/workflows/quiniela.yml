name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    # ULTRA VELOZ: Rango horario validado
    - cron: '15-59/3 13 * * 1-6'
    - cron: '0-59/3 15 * * 1-6'
    - cron: '0-59/3 18 * * 1-6'
    - cron: '0-59/3 21 * * 1-6'
    - cron: '0-59/3 0 * * 0,2-6'
    - cron: '0-30/3 1 * * 0,2-6'
  workflow_dispatch:

jobs:
  actualizar:
    runs-ok: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Scrapear sorteos
        id: scrape
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os, glob
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36","Referer":"https://google.com"}
          TZ_ARG = ZoneInfo("America/Argentina/Buenos_Aires")
          AHORA = datetime.now(TZ_ARG)
          HOY = AHORA.strftime("%Y-%m-%d")

          if AHORA.weekday() == 6 and AHORA.hour >= 2:
              print(f"Domingo {HOY} - sin sorteos, se omite")
              exit(0)

          DIAS_A_CONSERVAR = 30
          os.makedirs("historial", exist_ok=True)
          ARCHIVO_HOY = f"historial/{HOY}.json"

          LOTERIAS_4CIFRAS = {
            "nacional":   "https://tujugada.com.ar",
            "provincia":  "https://tujugada.com.ar",
            "santafe":    "https://tujugada.com.ar",
            "cordoba":    "https://tujugada.com.ar",
            "entrerios":  "https://tujugada.com.ar",
          }
          ORDEN_4CIFRAS = ["previa","primera","matutina","vespertina","nocturna"]
          MARGEN_MIN = 1  
          HORA_SORTEO_ARG = {"previa":(10,15), "primera":(12,0), "matutina":(15,0), "vespertina":(18,0), "nocturna":(21,0)}
          HORA_SORTEO_UY  = {"vespertina":(15,0), "nocturna":(21,0)}

          def ya_deberia_haber_salido(key, tabla_horarios):
              h, m = tabla_horarios[key]
              limite = AHORA.replace(hour=h, minute=m, second=0, microsecond=0) + timedelta(minutes=MARGEN_MIN)
              return AHORA >= limite

          URUGUAY_URL = "https://tujugada.com.ar"
          ORDEN_URUGUAY = ["vespertina","nocturna"]

          viejo = {}
          viejo_raw = {}
          if os.path.exists(ARCHIVO_HOY):
            try:
              viejo_raw = json.load(open(ARCHIVO_HOY,encoding="utf-8"))
              viejo = viejo_raw.get("completo",{})
            except: pass

          def limpiar(html):
              return html.replace("---MENSAJE PARA EL VISITANTE DE ESTE SITIO--- SI VES ESTE MENSAJE ES PORQUE VISITAS UN SITIO QUE ESTA COPIANDO CODIGO FUENTE AUTORIA DE TUJUGADA.COM.AR SIN AUTORIZACION. VISITA AL SITIO REAL QUE ACTUALIZA ESTOS DATOS EN ://tujugada.com.AR!!!", "")

          def mismo_path(url_pedido, url_final):
              return urlparse(url_pedido).path.lower() == urlparse(url_final).path.lower()

          def texto_plano(html_crudo):
              soup = BeautifulSoup(limpiar(html_crudo), "lxml")
              for tag in soup(["script", "style"]):
                  tag.decompose()
              texto = soup.get_text(separator=" ")
              texto = re.sub(r'\s+', ' ', texto)
              return texto

          def reordenar_columnas(lista):
              if len(lista) < 20:
                  return lista
              veinte = lista[:20]
              izquierda = veinte[0::2]
              derecha = veinte[1::2]
              return izquierda + derecha

          def extraer_sorteos(url, orden, digitos):
              sorteos = {k: [] for k in orden}
              patron = r'\b\d{%d}\b' % digitos
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30, allow_redirects=True)
                  if not mismo_path(url, r.url):
                      print(f"AVISO: {url} redirigio a {r.url} -> pagina no existe, se ignora")
                      return sorteos
                  low = texto_plano(r.text).lower()
                  for key in orden:
                      # MEJORA: Busqueda flexible que tolera puntos, espacios o variaciones en "hs"
                      m = re.search(rf'\b{key}\b', low)
                      if m:
                          idx = m.start()
                          trozo = low[idx: idx+1800]
                          nums = re.findall(patron, trozo)
                          uniq = []
                          for n in nums:
                              if n not in uniq:
                                  uniq.append(n)
                          if len(uniq) >= 15:
                              sorteos[key] = reordenar_columnas(uniq[:20])
                  print(f"{url} -> { {k: len(v) for k,v in sorteos.items()} }")
              except Exception as e:
                  print(f"Error {url}: {e}")
              return sorteos

          completo = {}
          for nombre, url in LOTERIAS_4CIFRAS.items():
              nuevo = extraer_sorteos(url, ORDEN_4CIFRAS, digitos=4)
              completo[nombre] = {}
              for k in ORDEN_4CIFRAS:
                  if not ya_deberia_haber_salido(k, HORA_SORTEO_ARG):
                      completo[nombre][k] = viejo.get(nombre,{}).get(k, [])
                  elif nuevo.get(k):
                      completo[nombre][k] = nuevo[k]
                  elif viejo.get(nombre,{}).get(k):
                      completo[nombre][k] = viejo[nombre][k]
                  else:
                      completo[nombre][k] = []

          nuevo_uy = extraer_sorteos(URUGUAY_URL, ORDEN_URUGUAY, digitos=3)
          completo["uruguay"] = {}
          for k in ORDEN_URUGUAY:
              if not ya_deberia_haber_salido(k, HORA_SORTEO_UY):
                  completo["uruguay"][k] = viejo.get("uruguay",{}).get(k, [])
              elif nuevo_uy.get(k):
                  completo["uruguay"][k] = nuevo_uy[k]
              elif viejo.get("uruguay",{}).get(k):
                  completo["uruguay"][k] = viejo["uruguay"][k]
              else:
                  completo["uruguay"][k] = []

          if viejo and completo == viejo:
              print("Sin cambios en numeros - no se escribe para ahorrar deploy en Cloudflare")
              with open(os.environ.get('GITHUB_OUTPUT','/tmp/out'), 'a') as out:
                  out.write("cambio=no\n")
              exit(0)

          output = {
              "fecha": HOY,
              "actualizado": AHORA.strftime("%d/%m/%Y %H:%M"),
              "completo": completo,
              "nacional":  completo["nacional"].get("nocturna",[]),
              "provincia": completo["provincia"].get("nocturna",[]),
              "santafe":   completo["santafe"].get("nocturna",[]),
              "cordoba":   completo["cordoba"].get("nocturna",[]),
              "entrerios": completo["entrerios"].get("nocturna",[]),
              "uruguay":   completo["uruguay"].get("nocturna",[]),
          }

          with open(ARCHIVO_HOY,"w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)

          limite = AHORA.date() - timedelta(days=DIAS_A_CONSERVAR)
          for ruta in glob.glob("historial/*.json"):
              nombre = os.path.basename(ruta).replace(".json","")
              try:
                  fecha_archivo = datetime.strptime(nombre, "%Y-%m-%d").date()
                  if fecha_archivo < limite:
                      os.remove(ruta)
                      print(f"Borrado por antiguedad: {ruta}")
              except ValueError:
                  pass

          print(f"OK JSON generado con cambios para {HOY}")
          with open(os.environ.get('GITHUB_OUTPUT','/tmp/out'), 'a') as out:
              out.write("cambio=si\n")
          PY

      - name: Commit solo si hay numeros nuevos
        if: steps.scrape.outputs.cambio == 'si'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Actualizacion quiniela"
          file_pattern: 'quiniela.json historial/'

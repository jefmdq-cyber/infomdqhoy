name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [principal, main]
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear sorteos
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os, glob
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup
          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122","Referer":"https://www.google.com/"}
          TZ_ARG = ZoneInfo("America/Argentina/Buenos_Aires")
          AHORA = datetime.now(TZ_ARG)
          HOY = AHORA.strftime("%Y-%m-%d")
          if AHORA.weekday() == 6:
              print(f"Domingo {HOY} - sin sorteos")
              exit(0)
          DIAS_A_CONSERVAR = 30
          os.makedirs("historial", exist_ok=True)
          ARCHIVO_HOY = f"historial/{HOY}.json"
          LOTERIAS_4CIFRAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela_santa_fe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela_cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela_entre_rios.asp",
          }
          ORDEN_4CIFRAS = ["previa","primera","matutina","vespertina","nocturna"]
          MARGEN_MIN = 20
          HORA_SORTEO_ARG = {"previa":(10,15), "primera":(12,0), "matutina":(15,0), "vespertina":(18,0), "nocturna":(21,0)}
          HORA_SORTEO_UY = {"vespertina":(15,0), "nocturna":(21,0)}
          def ya_deberia_haber_salido(k, tabla):
              h, m = tabla[k]
              limite = AHORA.replace(hour=h, minute=m, second=0, microsecond=0) + timedelta(minutes=MARGEN_MIN)
              return AHORA >= limite
          URUGUAY_URL = "https://www.tujugada.com.ar/quiniela_uruguay.asp"
          ORDEN_URUGUAY = ["vespertina","nocturna"]
          viejo = {}
          if os.path.exists(ARCHIVO_HOY):
            try: viejo = json.load(open(ARCHIVO_HOY,encoding="utf-8")).get("completo",{})
            except: pass
          def limpiar(html): return html.replace("---MENSAJE PARA EL VISITANTE DE ESTE SITIO--- SI VES ESTE MENSAJE ES PORQUE VISITAS UN SITIO QUE ESTA COPIANDO CODIGO FUENTE AUTORIA DE TUJUGADA.COM.AR SIN AUTORIZACION. VISITA AL SITIO REAL QUE ACTUALIZA ESTOS DATOS EN WWW.TUJUGADA.COM.AR!!!", "")
          def mismo_path(a,b): return urlparse(a).path.lower() == urlparse(b).path.lower()
          def texto_plano(h):
              soup = BeautifulSoup(limpiar(h), "lxml")
              for t in soup(["script","style"]): t.decompose()
              tx = soup.get_text(separator=" ")
              return re.sub(r'\s+', ' ', tx)
          def reordenar_columnas(l):
              if len(l) < 20: return l
              return l[0::2] + l[1::2]
          def extraer_sorteos(url, orden, digitos):
              sorteos = {k: [] for k in orden}
              patron = r'\b\d{%d}\b' % digitos
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30, allow_redirects=True)
                  if not mismo_path(url, r.url): return sorteos
                  low = texto_plano(r.text).lower()
                  for key in orden:
                      m = re.search(rf'\b{key}\b\s+\d{{1,2}}:\d{{2}}\s*hs\b', low)
                      if m:
                          trozo = low[m.start(): m.start()+1500]
                          nums = re.findall(patron, trozo)
                          uniq = []
                          for n in nums:
                              if n not in uniq: uniq.append(n)
                          if len(uniq) >= 15: sorteos[key] = reordenar_columnas(uniq[:20])
              except Exception as e: print(f"Error {url}: {e}")
              return sorteos
          completo = {}
          for nombre, url in LOTERIAS_4CIFRAS.items():
              nuevo = extraer_sorteos(url, ORDEN_4CIFRAS, 4)
              completo[nombre] = {}
              for k in ORDEN_4CIFRAS:
                  if not ya_deberia_haber_salido(k, HORA_SORTEO_ARG): completo[nombre][k] = []
                  elif nuevo.get(k): completo[nombre][k] = nuevo[k]
                  elif viejo.get(nombre,{}).get(k): completo[nombre][k] = viejo[nombre][k]
                  else: completo[nombre][k] = []
          nuevo_uy = extraer_sorteos(URUGUAY_URL, ORDEN_URUGUAY, 3)
          completo["uruguay"] = {}
          for k in ORDEN_URUGUAY:
              if not ya_deberia_haber_salido(k, HORA_SORTEO_UY): completo["uruguay"][k] = []
              elif nuevo_uy.get(k): completo["uruguay"][k] = nuevo_uy[k]
              elif viejo.get("uruguay",{}).get(k): completo["uruguay"][k] = viejo["uruguay"][k]
              else: completo["uruguay"][k] = []
          output = {"fecha": HOY, "actualizado": AHORA.strftime("%d/%m/%Y %H:%M"), "completo": completo, "nacional": completo["nacional"].get("nocturna",[]), "provincia": completo["provincia"].get("nocturna",[]), "santafe": completo["santafe"].get("nocturna",[]), "cordoba": completo["cordoba"].get("nocturna",[]), "entrerios": completo["entrerios"].get("nocturna",[]), "uruguay": completo["uruguay"].get("nocturna",[])}
          with open(ARCHIVO_HOY,"w",encoding="utf-8") as f: json.dump(output,f,ensure_ascii=False,indent=2)
          with open("quiniela.json","w",encoding="utf-8") as f: json.dump(output,f,ensure_ascii=False,indent=2)
          limite = AHORA.date() - timedelta(days=DIAS_A_CONSERVAR)
          for ruta in glob.glob("historial/*.json"):
              try:
                  fa = datetime.strptime(os.path.basename(ruta).replace(".json",""), "%Y-%m-%d").date()
                  if fa < limite: os.remove(ruta)
              except: pass
          print(f"OK {HOY}")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizacion quiniela"
          file_pattern: 'quiniela.json historial/'

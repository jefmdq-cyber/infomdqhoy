name: Quiniela 20 TODOS los sorteos
on:
  schedule:
      - cron: '*/20 13-23,0-1 * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear sorteos
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os, glob
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122","Referer":"https://google.com"}
          TZ_ARG = ZoneInfo("America/Argentina/Buenos_Aires")
          AHORA = datetime.now(TZ_ARG)
          HOY = AHORA.strftime("%Y-%m-%d")
          DIAS_A_CONSERVAR = 30

          os.makedirs("historial", exist_ok=True)
          ARCHIVO_HOY = f"historial/{HOY}.json"

          LOTERIAS_4CIFRAS = {
            "nacional":   "https://tujugada.com.ar",
            "provincia":  "https://tujugada.com.ar",
            "santafe":    "https://tujugada.com.ar",
            "cordoba":    "https://tujugada.com.ar",
            "entrerios":  "https://tujugada.com.ar",
          }
          ORDEN_4CIFRAS = ["previa","primera","matutina","vespertina","nocturna"]

          MARGEN_MIN = 20
          HORA_SORTEO_ARG = {"previa":(10,15), "primera":(12,0), "matutina":(15,0), "vespertina":(18,0), "nocturna":(21,0)}
          HORA_SORTEO_UY  = {"vespertina":(15,0), "nocturna":(21,0)}

          def ya_deberia_haber_salido(key, tabla_horarios):
              h, m = tabla_horarios[key]
              limite = AHORA.replace(hour=h, minute=m, second=0, microsecond=0) + timedelta(minutes=MARGEN_MIN)
              return AHORA >= limite

          URUGUAY_URL = "https://tujugada.com.ar"
          ORDEN_URUGUAY = ["vespertina","nocturna"]

          viejo = {}
          if os.path.exists(ARCHIVO_HOY):
            try:
              viejo = json.load(open(ARCHIVO_HOY,encoding="utf-8")).get("completo",{})
            except: pass

          def limpiar(html):
              return html.replace("---MENSAJE PARA EL VISITANTE DE ESTE SITIO--- SI VES ESTE MENSAJE ES PORQUE VISITAS UN SITIO QUE ESTA COPIANDO CODIGO FUENTE AUTORIA DE TUJUGADA.COM.AR SIN AUTORIZACION. VISITA AL SITIO REAL QUE ACTUALIZA ESTOS DATOS EN ://tujugada.com.AR!!!", "")

          def mismo_path(url_pedido, url_final):
              return urlparse(url_pedido).path.lower() == urlparse(url_final).path.lower()

          def texto_plano(html_crudo):
              soup = BeautifulSoup(limpiar(html_crudo), "lxml")
              for tag in soup(["script", "style"]):
                  tag.decompose()
              texto = soup.get_text(separator=" ")
              texto = re.sub(r'\s+', ' ', texto)
              return texto

          def reordenar_columnas(lista):
              if len(lista) < 20:
                  return lista
              veinte = lista[:20]
              izquierda = veinte[0::2]
              derecha = veinte[1::2]
              return izquierda + derecha

          def extraer_sorteos(url, orden, digitos, cly_key):
              sorteos = {k: [] for k in orden}
              patron = r'\b\d{%d}\b' % digitos
              
              sorteos_guardados = viejo.get(cly_key, {})
              
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30, allow_redirects=True)
                  if not mismo_path(url, r.url):
                      return sorteos_guardados if sorteos_guardados else sorteos

                  texto_completo = texto_plano(r.text)
                  low = texto_completo.lower()
                  
                  fecha_actual_str = AHORA.strftime("%d/%m/%Y")
                  pag_tiene_fecha_hoy = fecha_actual_str in texto_completo

                  for key in orden:
                      if sorteos_guardados and len(sorteos_guardados.get(key, [])) >= 15:
                          sorteos[key] = sorteos_guardados[key]
                          continue
                          
                      if not ya_deberia_haber_salido(key, HORA_SORTEO_ARG if digitos==4 else HORA_SORTEO_UY):
                          sorteos[key] = []
                          continue

                      if not pag_tiene_fecha_hoy:
                          sorteos[key] = []
                          continue

                      m = re.search(rf'\b{key}\b\s+\d{{1,2}}:\d{{2}}\s*hs\b', low)
                      if m:
                          idx = m.start()
                          trozo = low[idx: idx+1500]
                          nums = re.findall(patron, trozo)
                          uniq = []
                          for n in nums:
                              if n not in uniq:
                                  uniq.append(n)
                          if len(uniq) >= 15:
                              sorteos[key] = reordenar_columnas(uniq)
              except Exception as e:
                  print(f"Error en {url}: {e}")
                  return sorteos_guardados if sorteos_guardados else sorteos
              return sorteos
          
          resultado_final = {}
          for cly, url_lot in LOTERIAS_4CIFRAS.items():
              resultado_final[cly] = extraer_sorteos(url_lot, ORDEN_4CIFRAS, 4, cly)
          
          resultado_final["uruguay"] = extraer_sorteos(URUGUAY_URL, ORDEN_URUGUAY, 3, "uruguay")

          output_data = {
            "completo": resultado_final,
            "ultima_actualizacion": AHORA.strftime("%d/%m/%Y %H:%M")
          }

          with open(ARCHIVO_HOY, "w", encoding="utf-8") as f:
              json.dump(output_data, f, ensure_ascii=False, indent=2)
              
          with open("quiniela.json", "w", encoding="utf-8") as f:
              json.dump(output_data, f, ensure_ascii=False, indent=2)
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@infomdq.com"
          git add historial/ || true
          git add quiniela.json || true
          git commit -m "Update Quiniela final" || true
          git push


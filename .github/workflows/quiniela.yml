name: Quiniela 20 TODOS los sorteos
on:
  schedule:
      - cron: '*/20 13-23,0-1 * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear sorteos
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os, glob
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122","Referer":"https://www.google.com/"}
          TZ_ARG = ZoneInfo("America/Argentina/Buenos_Aires")
          AHORA = datetime.now(TZ_ARG)
          HOY = AHORA.strftime("%Y-%m-%d")
          DIAS_A_CONSERVAR = 30

          os.makedirs("historial", exist_ok=True)
          ARCHIVO_HOY = f"historial/{HOY}.json"

          # URLs REALES verificadas contra el menu del sitio (15/9/2026).
          # OJO: si el sitio vuelve a cambiar de nombre de pagina, la validacion
          # "mismo_path" de abajo evita que agarremos la portada por error.
          LOTERIAS_4CIFRAS = {
            "nacional":   "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia":  "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
            "santafe":    "https://www.tujugada.com.ar/quiniela_santa_fe.asp",
            "cordoba":    "https://www.tujugada.com.ar/quiniela_cordoba.asp",
            "entrerios":  "https://www.tujugada.com.ar/quiniela_entre_rios.asp",
          }
          ORDEN_4CIFRAS = ["previa","primera","matutina","vespertina","nocturna"]

          # Horarios oficiales de cada sorteo + minutos de margen para que el
          # sitio termine de publicar el resultado. Antes de esa hora, aunque
          # el sitio muestre numeros (son los de AYER, que tujugada deja
          # "pegados" hasta que sale el nuevo), no los usamos como si fueran
          # de hoy.
          MARGEN_MIN = 20
          HORA_SORTEO_ARG = {"previa":(10,15), "primera":(12,0), "matutina":(15,0), "vespertina":(18,0), "nocturna":(21,0)}
          HORA_SORTEO_UY  = {"vespertina":(15,0), "nocturna":(21,0)}

          def ya_deberia_haber_salido(key, tabla_horarios):
              h, m = tabla_horarios[key]
              limite = AHORA.replace(hour=h, minute=m, second=0, microsecond=0) + timedelta(minutes=MARGEN_MIN)
              return AHORA >= limite

          # Uruguay es aparte: 3 cifras and solo 2 sorteos por dia.
          URUGUAY_URL = "https://www.tujugada.com.ar/quiniela_uruguay.asp"
          ORDEN_URUGUAY = ["vespertina","nocturna"]

          # carga viejo para no pisar nunca con datos vacios.
          viejo = {}
          if os.path.exists(ARCHIVO_HOY):
            try:
              viejo = json.load(open(ARCHIVO_HOY,encoding="utf-8")).get("completo",{})
            except: pass

          def limpiar(html):
              return html.replace("---MENSAJE PARA EL VISITANTE DE ESTE SITIO--- SI VES ESTE MENSAJE ES PORQUE VISITAS UN SITIO QUE ESTA COPIANDO CODIGO FUENTE AUTORIA DE TUJUGADA.COM.AR SIN AUTORIZACION. VISITA AL SITIO REAL QUE ACTUALIZA ESTOS DATOS EN WWW.TUJUGADA.COM.AR!!!", "")

          def mismo_path(url_pedido, url_final):
              return urlparse(url_pedido).path.lower() == urlparse(url_final).path.lower()

          def texto_plano(html_crudo):
              soup = BeautifulSoup(limpiar(html_crudo), "lxml")
              for tag in soup(["script", "style"]):
                  tag.decompose()
              texto = soup.get_text(separator=" ")
              texto = re.sub(r'\s+', ' ', texto)
              return texto

          def reordenar_columnas(lista):
              if len(lista) < 20:
                  return lista
              veinte = lista[:20]
              izquierda = veinte[0::2]  # posiciones reales 1-10
              derecha = veinte[1::2]    # posiciones reales 11-20
              return izquierda + derecha

          def extraer_sorteos(url, orden, digitos):
              sorteos = {k: [] for k in orden}
              patron = r'\b\d{%d}\b' % digitos
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30, allow_redirects=True)

                  if not mismo_path(url, r.url):
                      print(f"AVISO: {url} redirigio a {r.url} -> pagina no existe, se ignora")
                      return sorteos

                  low = texto_plano(r.text).lower()
                  for key in orden:
                      m = re.search(rf'\b{key}\b\s+\d{{1,2}}:\d{{2}}\s*hs\b', low)
                      if m:
                          idx = m.start()
                          trozo = low[idx: idx+1500]
                          nums = re.findall(patron, trozo)
                          uniq = []
                          for n in nums:
                              if n not in uniq:
                                  uniq.append(n)
                          if len(uniq) >= 15:
                              # Ajuste Quirurgico: Uruguay (3 cifras) no se reordena; Argentina (4 cifras) si.
                              if digitos == 3:
                                  sorteos[key] = uniq[:20]
                              else:
                                  sorteos[key] = reordenar_columnas(uniq[:20])
              except Exception as e:
                  print(f"Error {url}: {e}")
              return sorteos
          
          resultado_final = {}
          for cly, url_lot in LOTERIAS_4CIFRAS.items():
              if ya_deberia_haber_salido(cly_key := ORDEN_4CIFRAS[0], HORA_SORTEO_ARG):
                  resultado_final[cly] = extraer_sorteos(url_lot, ORDEN_4CIFRAS, 4)
          
          if ya_deberia_haber_salido(ORDEN_URUGUAY[0], HORA_SORTEO_UY):
              resultado_final["uruguay"] = extraer_sorteos(URUGUAY_URL, ORDEN_URUGUAY, 3)

          output_data = {
            "completo": resultado_final,
            "ultima_actualizacion": AHORA.strftime("%d/%m/%Y %H:%M")
          }

          with open(ARCHIVO_HOY, "w", encoding="utf-8") as f:
              json.dump(output_data, f, ensure_ascii=False, indent=2)
              
          with open("quiniela.json", "w", encoding="utf-8") as f:
              json.dump(output_data, f, ensure_ascii=False, indent=2)
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@infomdq.com"
          git add historial/ || true
          git add quiniela.json || true
          git commit -m "Update Quiniela oficial fin de semana" || true
          git push

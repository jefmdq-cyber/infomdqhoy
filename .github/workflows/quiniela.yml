name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os
          from datetime import datetime, timedelta, timezone
          from bs4 import BeautifulSoup
          HEADERS = {"User-Agent": "Mozilla/5.0"}
          LOTERIAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela_santa_fe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela_cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela_entre_rios.asp",
          }
          ORDEN = ["previa","primera","matutina","vespertina","nocturna"]
          HORARIOS = {"previa": 10, "primera": 12, "matutina": 15, "vespertina": 18, "nocturna": 21}
          zona = timezone(timedelta(hours=-3))
          hoy = datetime.now(zona)
          dia_mes = f"{hoy.day}/{hoy.month}"
          hora = hoy.hour + hoy.minute/60
          def extraer(url, orden, digitos):
              res = {k: [] for k in orden}
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  txt = BeautifulSoup(r.text, "lxml").get_text(" ", strip=True)
                  pat = re.compile(r'(\d{1,2}/\d{1,2}(?:/\d{2,4})?)\s*-\s*(previa|primera|matutina|vespertina|nocturna)\s+\d{1,2}:\d{2}', re.I)
                  for m in pat.finditer(txt):
                      fecha = m.group(1); sorteo = m.group(2).lower()
                      if sorteo not in orden: continue
                      if dia_mes not in fecha.replace('/0','/'): continue
                      if hora < HORARIOS[sorteo] + 0.25: continue
                      trozo = txt[m.end():m.end()+3500]
                      nums = re.findall(rf'\b\d{{{digitos}}}\b', trozo)
                      uniq=[n for n in dict.fromkeys(nums) if not n.startswith("20")]
                      if len(uniq)>=10: res[sorteo]=uniq[:20]
              except Exception as e: print(e)
              return res
          completo={k:extraer(u, ORDEN, 4) for k,u in LOTERIAS.items()}
          completo["uruguay"]=extraer("https://www.tujugada.com.ar/quiniela_uruguay.asp", ["vespertina","nocturna"], 3)
          out={"actualizado": hoy.strftime("%d/%m/%Y %H:%M"), "fecha": hoy.strftime("%Y-%m-%d"), "completo": completo,
               "nacional": completo["nacional"].get("nocturna",[]), "provincia": completo["provincia"].get("nocturna",[]),
               "santafe": completo["santafe"].get("nocturna",[]), "cordoba": completo["cordoba"].get("nocturna",[]),
               "entrerios": completo["entrerios"].get("nocturna",[]), "uruguay": completo["uruguay"].get("nocturna",[])}
          with open("quiniela.json","w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          os.makedirs("historial", exist_ok=True)
          with open(f"historial/{hoy.strftime('%Y-%m-%d')}.json","w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix completo todas loterias"
          file_pattern: |
            quiniela.json
            historial/*.json

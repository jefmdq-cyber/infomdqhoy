name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear sorteos
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os
          from datetime import datetime, timedelta, timezone
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122"}
          LOTERIAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela_santa_fe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela_cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela_entre_rios.asp",
          }
          ORDEN = ["previa","primera","matutina","vespertina","nocturna"]
          URL_UY = "https://www.tujugada.com.ar/quiniela_uruguay.asp"
          ORDEN_UY = ["vespertina","nocturna"]

          zona = timezone(timedelta(hours=-3))
          hoy = datetime.now(zona)
          fecha_hoy_corta = f"{hoy.day}/{hoy.month}/{hoy.year}" # 15/9/2026
          fecha_hoy_iso = hoy.strftime("%Y-%m-%d")

          def extraer(url, orden, digitos):
              res = {k: [] for k in orden}
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  soup = BeautifulSoup(r.text, "lxml")
                  texto = soup.get_text(" ", strip=True)
                  # Busca bloques como "15/9/2026 - Nocturna 21:00 hs."
                  # Solo aceptamos si la fecha del bloque es la de HOY
                  for key in orden:
                      # todos los bloques de ese sorteo con fecha
                      patron_bloque = re.compile(rf'(\d{{1,2}}/\d{{1,2}}/\d{{2,4}})\s*-\s*{key}\s+\d{{1,2}}:\d{{2}}', re.I)
                      for m in patron_bloque.finditer(texto):
                          fecha_encontrada = m.group(1)
                          # Normaliza 14/9/26 -> 14/9/2026
                          if str(hoy.year) not in fecha_encontrada and str(hoy.year)[-2:] not in fecha_encontrada:
                              continue
                          # Chequea que sea HOY
                          if f"{hoy.day}/{hoy.month}" not in fecha_encontrada:
                              continue
                          inicio = m.start()
                          fin = inicio + 3000
                          trozo = texto[inicio:fin]
                          nums = re.findall(rf'\b\d{{{digitos}}}\b', trozo)
                          nums = [n for n in nums if not n.startswith("20")]
                          uniq = []
                          for n in nums:
                              if n not in uniq:
                                  uniq.append(n)
                          if len(uniq) >= 10:
                              res[key] = uniq[:20]
                              break # ya encontramos el de hoy, no seguimos buscando ayer
                  print(f"{url} {fecha_hoy_corta} -> {res}")
              except Exception as e:
                  print(f"Error {url}: {e}")
              return res

          completo = {}
          for nombre, url in LOTERIAS.items():
              completo[nombre] = extraer(url, ORDEN, 4)
          completo["uruguay"] = extraer(URL_UY, ORDEN_UY, 3)

          output = {
              "actualizado": hoy.strftime("%d/%m/%Y %H:%M"),
              "fecha": fecha_hoy_iso,
              "completo": completo,
              "nacional": completo["nacional"].get("nocturna",[]),
              "provincia": completo["provincia"].get("nocturna",[]),
              "santafe": completo["santafe"].get("nocturna",[]),
              "cordoba": completo["cordoba"].get("nocturna",[]),
              "entrerios": completo["entrerios"].get("nocturna",[]),
              "uruguay": completo["uruguay"].get("nocturna",[]),
          }

          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          os.makedirs("historial", exist_ok=True)
          with open(f"historial/{fecha_hoy_iso}.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print(f"OK {fecha_hoy_iso} - {fecha_hoy_corta}")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "quiniela fix fecha hoy"
          file_pattern: |
            quiniela.json
            historial/*.json

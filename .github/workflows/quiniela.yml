name: Quiniela 20 TODOS los sorteos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear TuJugada Estricto
        run: |
          pip install requests beautifulsoup4 lxml pytz
          python << 'PY'
          import requests, json, os, re
          from datetime import datetime
          from bs4 import BeautifulSoup
          import pytz

          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"}
          
          # Slugs exactos de tujugada.com.ar
          LOTERIAS = {
              "nacional": "nacional",
              "provincia": "provincia",
              "santafe": "santa-fe",
              "cordoba": "cordoba",
              "entrerios": "entre-rios",
              "uruguay": "montevideo"
          }

          ORDEN_ARG = ["previa", "primera", "matutina", "vespertina", "nocturna"]
          ORDEN_UY = ["vespertina", "nocturna"]

          viejo = {}
          if os.path.exists("quiniela.json"):
              try:
                  viejo = json.load(open("quiniela.json", encoding="utf-8")).get("completo", {})
              except Exception:
                  pass

          tz_arg = pytz.timezone('America/Argentina/Buenos_Aires')
          completo = {lot: {s: [] for s in (ORDEN_UY if lot == "uruguay" else ORDEN_ARG)} for lot in LOTERIAS}

          for lot_key, slug in LOTERIAS.items():
              url = f"https://www.tujugada.com.ar/resultados-quiniela-{slug}.asp"
              try:
                  r = requests.get(url, headers=HEADERS, timeout=15)
                  if r.status_code != 200:
                      continue

                  soup = BeautifulSoup(r.text, "lxml")
                  
                  # Buscamos todos los contendores o tablas de resultados
                  # En TuJugada cada sorteo viene identificado por su título
                  texto_completo = soup.get_text()
                  sorteos_disponibles = ORDEN_UY if lot_key == "uruguay" else ORDEN_ARG
                  
                  for s_nom in sorteos_disponibles:
                      # Buscar el bloque del sorteo específico usando expresiones regulares
                      # Captura desde la palabra del sorteo hasta las 20 posiciones
                      pattern = rf'{s_nom}.*?(?:1[º°\.\s]+(\d{{3,4}}).*?20[º°\.\s]+(\d{{3,4}}))'
                      
                      # Alternativa: Buscar extracción directa de 20 números en las tablas/divs
                      # Extraemos todas las secuencias donde aparecen posiciones del 1 al 20
                      posiciones = {}
                      
                      # Escaneamos todo el HTML buscando pares "X° NNNN"
                      # Ejemplo: "1° 1234", "1 - 1234", "1. 1234"
                      digitos = 3 if lot_key == "uruguay" else 4
                      matches = re.findall(rf'\b([1-9]|1[0-9]|20)[\sº°\.\-\:]+(\d{{{digitos}}})\b', r.text)
                      
                      # Filtrar secuencias limpias consecutivas del 1 al 20
                      temp_pos = {}
                      for pos_str, num_str in matches:
                          p = int(pos_str)
                          if p not in temp_pos:
                              temp_pos[p] = num_str
                          if len(temp_pos) == 20:
                              break
                      
                      # Si encontramos un extracto completo de 20 números
                      if len(temp_pos) == 20:
                          lista_20 = [temp_pos[i] for i in range(1, 21)]
                          # Asignar al sorteo actual si está presente en la sección
                          completo[lot_key][s_nom] = lista_20

              except Exception as e:
                  print(f"Error parseando {lot_key}: {e}")

          # PRESERVAR: Si un sorteo de hoy ya había salido o el scraper falló en este ciclo, mantener el dato viejo
          for lot, sorteos in completo.items():
              for s, nums in sorteos.items():
                  if not nums or len(nums) < 20:
                      if viejo.get(lot, {}).get(s) and len(viejo[lot][s]) == 20:
                          completo[lot][s] = viejo[lot][s]

          output = {
              "actualizado": datetime.now(tz_arg).strftime("%d/%m/%Y %H:%M"),
              "completo": completo,
              "nacional":  completo["nacional"].get("nocturna", []),
              "provincia": completo["provincia"].get("nocturna", []),
              "santafe":   completo["santafe"].get("nocturna", []),
              "cordoba":   completo["cordoba"].get("nocturna", []),
              "entrerios": completo["entrerios"].get("nocturna", []),
              "uruguay":   completo["uruguay"].get("nocturna", []),
          }

          with open("quiniela.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("OK: quiniela.json actualizado con éxito.")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "FIX: Extracción y preservación estricta de 20 números"
          file_pattern: quiniela.json

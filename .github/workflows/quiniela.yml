                      print(f"AVISO: {url} redirigio a {r.url} -> pagina no existe, se ignora")
                      sorteos de devolución
                  bajo = texto_plano(r.text).lower()
                  para clave en orden:
                      m = re.search(rf'\b{key}\b\s+\d{{1,2}}:\d{{2}}\s*hs\b', low)
                      si m:
                          idx = m.start()
                          trozo = bajo[idx: idx+1500]
                          nums = re.findall(patrón, trozo)
                          uniq = []
                          para n en nums:
                              Si n no está en uniq:
                                  uniq.append(n)
                          Si len(uniq) >= 15:
                              sorteos[clave] = reordenar_columnas(uniq[:20])
                  print(f"{url} -> {sorteos}")
              excepto Exception como e:
                  print(f"Error {url}: {e}")
              sorteos de devolución
          completo = {}
          para nombre, url en LOTERIAS_4CIFRAS.items():
              nuevo = extraer_sorteos(url, ORDEN_4CIFRAS, digitos=4)
              completo[nombre] = {}
              para k en ORDEN_4CIFRAS:
                  si no ya_deberia_haber_salido(k, HORA_SORTEO_ARG):
                      completo[nombre][k] = []

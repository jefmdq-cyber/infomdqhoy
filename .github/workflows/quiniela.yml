          HORA_SORTEO_UY = {"vespertina":(15,0), "nocturna":(21,0)}
          def ya_deberia_haber_salido(clave, tabla_horarios):
              h, m = tabla_horarios[clave]
              límite = AHORA.replace(hour=h, minute=m, second=0, microsecond=0) + timedelta(minutes=MARGEN_MIN)
              devolver AHORA >= límite

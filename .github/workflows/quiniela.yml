name: Actualizar quiniela
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar quiniela
        run: |
          pip install requests beautifulsoup4
          cat > script.py << 'PY'
          import json, re, requests
          from datetime import datetime
          from bs4 import BeautifulSoup
          try:
              r = requests.get("https://www.dejugadas.com/quiniela-hoy-resultados-todas", headers={"User-Agent":"Mozilla/5.0"}, timeout=20)
              soup = BeautifulSoup(r.text, "html.parser")
              texto = soup.get_text(" ", strip=True)
              res = {}
              for m in re.findall(r'(Nacional|Provincia|Buenos Aires|Santa Fe|Cordoba|Entre Rios)\s+(\d{3,4})', texto, re.I):
                  res[m[0].title()] = m[1]
              data = {"actualizado": datetime.now().strftime("%d/%m %H:%M"), "resultados": res}
              json.dump(data, open("quiniela.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          except Exception as e:
              print(e)
          PY
          python script.py
      - name: Subir
        run: |
          cp quiniela.json /tmp/q.json
          git checkout -- quiniela.json || true
          git config user.name "robot"
          git config user.email "robot@bot.com"
          git pull --rebase
          cp /tmp/q.json quiniela.json
          git add quiniela.json
          git diff --staged --quiet || (git commit -m "auto" && git push)

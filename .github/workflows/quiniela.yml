name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear 20x5 sorteos
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os
          from datetime import datetime

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36",
              "Referer": "https://www.tujugada.com.ar/",
              "Accept-Language": "es-AR,es;q=0.9"
          }

          def limpiar(s):
              return s.replace("---MENSAJE PARA EL VISITANTE DE ESTE SITIO--- SI VES ESTE MENSAJE ES PORQUE VISITAS UN SITIO QUE ESTA COPIANDO CODIGO FUENTE AUTORIA DE TUJUGADA.COM.AR SIN AUTORIZACION. VISITA AL SITIO REAL QUE ACTUALIZA ESTOS DATOS EN WWW.TUJUGADA.COM.AR!!!", "")

          def extraer_5_distintos(url):
              sorteos = {"previa":[],"primera":[],"matutina":[],"vespertina":[],"nocturna":[]}
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  html = limpiar(r.text)
                  # Busca cada bloque: "Nocturna 21:00 hs.... <table>... 0535... </table>"
                  # El patron agarra el nombre del sorteo y su tabla siguiente
                  patron = re.compile(r'(previa|primera|matutina|vespertina|nocturna)[^<]{0,200}?</[^>]+>(.*?)<table[^>]*>(.*?)</table>', re.IGNORECASE | re.DOTALL)
                  for m in patron.finditer(html):
                      key = m.group(1).lower()
                      tabla_html = m.group(3)
                      nums = re.findall(r'\b\d{4}\b', tabla_html)
                      nums = [n for n in nums if not n.startswith("202")][:20]
                      if len(nums) >= 10: # minimo 10 para considerar valida
                          # Solo guarda si no tenia nada, para no pisar con repetido
                          if not sorteos[key] or len(nums)==20:
                              sorteos[key] = nums[:20]
                  print(f"{url.split('/')[-1]} -> { {k: v[0] if v else 'FALLO' for k,v in sorteos.items()} }")
              except Exception as e:
                  print(f"Error {url}: {e}")
              return sorteos

          LOTERIAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela-provincia.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela-santafe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela-cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela-entrerios.asp",
          }

          # Carga quiniela.json viejo para NUNCA poner 0000
          viejo = {}
          if os.path.exists("quiniela.json"):
              try:
                  with open("quiniela.json","r",encoding="utf-8") as f:
                      viejo = json.load(f).get("completo",{})
              except: pass

          completo = {}
          for nombre, url in LOTERIAS.items():
              nuevo = extraer_5_distintos(url)
              completo[nombre] = {}
              for k in ["previa","primera","matutina","vespertina","nocturna"]:
                  if len(nuevo[k]) >= 10:
                      completo[nombre][k] = nuevo[k]
                  elif viejo.get(nombre,{}).get(k):
                      completo[nombre][k] = viejo[nombre][k] # mantiene anterior, no 0000
                  else:
                      completo[nombre][k] = nuevo[k] # aunque sea corto, no 0000

          # URUGUAY - 2 sorteos de 3 cifras REALES (719, 476, etc)
          try:
              r = requests.get("https://www.loteriasyquinielas.com.uy/quiniela/", headers=HEADERS, timeout=20)
              html = r.text
              # La pagina uruguaya tiene formato: 01.719 02.476 etc (3 cifras)
              nums = re.findall(r'\b\d{3}\b', html)
              # Filtra y quita repetidos manteniendo orden
              unicos = []
              for n in nums:
                  if n not in unicos and n!= "000":
                      unicos.append(n)
              print(f"Uruguay raw: {unicos[:5]}")
              if len(unicos) >= 40:
                  ves = unicos[:20]
                  noc = unicos[20:40]
              elif len(unicos) >= 20:
                  ves = unicos[:20]
                  noc = unicos[:20]
              else:
                  ves = []; noc = []

              # Si ya teniamos viejo, usalo antes de poner 000
              if not ves and viejo.get("uruguay",{}).get("vespertina"):
                  ves = viejo["uruguay"]["vespertina"]
              if not noc and viejo.get("uruguay",{}).get("nocturna"):
                  noc = viejo["uruguay"]["nocturna"]

              # Pasa todo a 3 cifras por seguridad
              ves = [n[-3:].zfill(3) for n in ves]
              noc = [n[-3:].zfill(3) for n in noc]

              completo["uruguay"] = {"vespertina": ves, "nocturna": noc}
          except Exception as e:
              print(f"Error UY: {e}")
              completo["uruguay"] = viejo.get("uruguay", {"vespertina":[], "nocturna":[]})

          # Asegura que no quede vacio por primera vez
          for lot in completo:
              for s in completo[lot]:
                  if not completo[lot][s]:
                      completo[lot][s] = viejo.get(lot,{}).get(s, []) or (["000"]*20 if lot=="uruguay" else ["0000"]*20)

          output = {
              "actualizado": datetime.now().strftime("%d/%m/%Y %H:%M"),
              "completo": completo,
              "nacional": completo["nacional"]["nocturna"],
              "provincia": completo["provincia"]["nocturna"],
              "santafe": completo["santafe"]["nocturna"],
              "cordoba": completo["cordoba"]["nocturna"],
              "entrerios": completo["entrerios"]["nocturna"],
              "uruguay": completo["uruguay"]["nocturna"]
          }

          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print("OK FINAL - sin repetir y Uruguay 3 cifras")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix definitivo 5 sorteos distintos Uruguay 3 cifras"
          file_pattern: quiniela.json


on:
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear sorteos ULTRA SEGURO - no borra nunca lo ya sorteado
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122"}
          TZ_ARG = ZoneInfo("America/Argentina/Buenos_Aires")
          AHORA = datetime.now(TZ_ARG)
          HOY = AHORA.strftime("%Y-%m-%d")
          os.makedirs("historial", exist_ok=True)
          ARCHIVO_HOY = f"historial/{HOY}.json"

          LOTERIAS = ["nacional","provincia","santafe","cordoba","entrerios"]
          ORDEN = ["previa","primera","matutina","vespertina","nocturna"]
          HORA = {"previa":(10,15), "primera":(12,0), "matutina":(15,0), "vespertina":(18,0), "nocturna":(21,0)}
          HORA_UY = {"vespertina":(15,0), "nocturna":(21,0)}
          MARGEN = 20

          def ya_deberia(key, tabla):
              h,m = tabla[key]
              limite = AHORA.replace(hour=h, minute=m, second=0, microsecond=0) + timedelta(minutes=MARGEN)
              return AHORA >= limite

          def texto_plano(html):
              soup = BeautifulSoup(html, "lxml")
              for t in soup(["script","style"]): t.decompose()
              return re.sub(r'\s+', ' ', soup.get_text(" "))

          def reordenar(lista):
              if len(lista)<20: return lista
              return lista[0::2] + lista[1::2]

          # Cargar lo que ya hay hoy para NO BORRARLO
          viejo = {}
          if os.path.exists(ARCHIVO_HOY):
              try: viejo = json.load(open(ARCHIVO_HOY,encoding="utf-8")).get("completo",{})
              except: pass
          if not viejo and os.path.exists("quiniela.json"):
              try: viejo = json.load(open("quiniela.json",encoding="utf-8")).get("completo",{})
              except: pass

          def extraer(url, orden, digitos, cly_key, tabla):
              sorteos = {k: [] for k in orden}
              guard = viejo.get(cly_key, {})
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  txt = texto_plano(r.text)
                  low = txt.lower()
                  for key in orden:
                      # REGLA 1: Si ya tenemos numeros guardados hoy, NUNCA los borres, conservalos
                      if guard and len(guard.get(key, [])) >= 15:
                          sorteos[key] = guard[key]
                          continue
                      # REGLA 2: Si todavia no es la hora, dejar en blanco
                      if not ya_deberia(key, tabla):
                          sorteos[key] = []
                          continue
                      # REGLA 3: Si es la hora y no teniamos nada, intentar extraer
                      m = re.search(rf'\b{key}\b', low)
                      if m:
                          trozo = low[m.start(): m.start()+2000]
                          nums = re.findall(rf'\b\d{{{digitos}}}\b', trozo)
                          uniq=[]
                          for n in nums:
                              if n not in uniq: uniq.append(n)
                          if len(uniq)>=15:
                              sorteos[key]=reordenar(uniq)
              except Exception as e:
                  print(f"Error {cly_key} {e}")
                  # En error, devolver lo guardado para no dejar todo en blanco
                  if guard:
                      for k in orden:
                          if guard.get(k): sorteos[k]=guard[k]
              return sorteos

          res={}
          for cly in LOTERIAS:
              res[cly]=extraer("https://tujugada.com.ar", ORDEN, 4, cly, HORA)
          res["uruguay"]=extraer("https://tujugada.com.ar", ["vespertina","nocturna"], 3, "uruguay", HORA_UY)

          out={"fecha":HOY,"fecha_arg":AHORA.strftime("%d/%m/%Y"),"completo":res,"ultima_actualizacion":AHORA.strftime("%d/%m/%Y %H:%M")}
          with open(ARCHIVO_HOY,"w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          with open("quiniela.json","w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(f"OK {HOY} guardado sin borrar sorteados")
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@infomdq.com"
          git add historial/ quiniela.json
          git commit -m "Fix ultra seguro no borra sorteados" || true
          git push

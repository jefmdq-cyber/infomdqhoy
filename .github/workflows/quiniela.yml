name: Quiniela - REGLA UNICA Argentina + Uruguay

on:
  schedule:
    - cron: '*/20 13-23,0-1 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrapear con MISMA REGLA para Argentina y Uruguay
        run: |
          pip install requests beautifulsoup4 lxml

          python << 'PY'
          import requests
          import re
          import json
          import os

          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122",
              "Accept-Language": "es-AR,es;q=0.9",
              "Referer": "https://www.tujugada.com.ar/"
          }

          TZ = ZoneInfo("America/Argentina/Buenos_Aires")
          AHORA = datetime.now(TZ)
          HOY = AHORA.strftime("%Y-%m-%d")

          os.makedirs("historial", exist_ok=True)

          ARCHIVO = f"historial/{HOY}.json"

          ORDEN = [
              "previa",
              "primera",
              "matutina",
              "vespertina",
              "nocturna"
          ]

          ORDEN_UY = [
              "vespertina",
              "nocturna"
          ]

          HORA = {
              "previa": (10, 15),
              "primera": (12, 0),
              "matutina": (15, 0),
              "vespertina": (18, 0),
              "nocturna": (21, 0)
          }

          HORA_UY = {
              "vespertina": (15, 0),
              "nocturna": (21, 0)
          }

          MARGEN = 25

          def ya_deberia(k, tabla):
              h, m = tabla[k]

              limite = AHORA.replace(
                  hour=h,
                  minute=m,
                  second=0,
                  microsecond=0
              ) + timedelta(minutes=MARGEN)

              return AHORA >= limite

          def reordenar_columnas(lista):
              """
              Tujugada entrega los resultados intercalados:
              1, 11, 2, 12, 3, 13...

              La salida correcta debe ser:
              1, 2, 3, 4, 5... 11, 12, 13...
              """

              if len(lista) < 20:
                  return lista

              return lista[0::2] + lista[1::2]

          def extraer_tabla_robusta(html, digitos):
              """
              Extrae únicamente los números de las columnas de resultados,
              evitando textos anti-bot y mensajes de la página.
              """

              soup = BeautifulSoup(html, "lxml")
              numeros = []

              for tr in soup.find_all("tr"):
                  tds = tr.find_all("td")

                  if len(tds) >= 4:
                      for col in [1, 3]:
                          txt = tds[col].get_text(" ", strip=True)

                          if not txt:
                              continue

                          if (
                              "MENSAJE" in txt.upper()
                              or "COPIANDO" in txt.upper()
                          ):
                              matches = re.findall(
                                  rf"\b\d{{{digitos}}}\b",
                                  txt
                              )

                              if matches:
                                  numeros.append(matches[-1])
                          else:
                              match = re.search(
                                  rf"\b\d{{{digitos}}}\b",
                                  txt
                              )

                              if match:
                                  numeros.append(match.group())

                          if len(numeros) >= 20:
                              break

                  if len(numeros) >= 20:
                      break

              return numeros

          viejo = {}

          if os.path.exists(ARCHIVO):
              try:
                  with open(ARCHIVO, encoding="utf-8") as archivo:
                      viejo = json.load(archivo).get("completo", {})
              except Exception:
                  viejo = {}

          def extraer(url, orden, digitos, key_loteria, tabla):
              sorteos = {k: [] for k in orden}
              guardado = viejo.get(key_loteria, {})

              try:
                  respuesta = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  soup = BeautifulSoup(respuesta.text, "lxml")
                  texto_bajo = soup.get_text(" ").lower()

                  for k in orden:
                      if not ya_deberia(k, tabla):
                          sorteos[k] = []

                          print(
                              f"{key_loteria} {k} "
                              "aún no sorteado -> vacío"
                          )

                          continue

                      indice = texto_bajo.find(k)

                      if indice == -1:
                          if guardado.get(k):
                              sorteos[k] = guardado[k]

                          continue

                      if digitos == 3:
                          """
                          Uruguay utiliza una tabla única. Se lee el HTML
                          completo para evitar el desfase que se produce
                          al usar un índice de texto sobre HTML crudo.
                          """

                          trozo_html = respuesta.text
                      else:
                          """
                          Argentina conserva la extracción original
                          por sección.
                          """

                          trozo_html = respuesta.text[
                              indice:indice + 15000
                          ]

                      raw = extraer_tabla_robusta(
                          trozo_html,
                          digitos
                      )

                      if len(raw) < 10:
                          trozo_texto = texto_bajo[
                              indice:indice + 5000
                          ]

                          raw2 = re.findall(
                              rf"\b\d{{{digitos}}}\b",
                              trozo_texto
                          )

                          uniq = []

                          for numero in raw2:
                              if numero not in uniq:
                                  uniq.append(numero)

                          raw = uniq[:20]

                      if len(raw) >= 10:
                          # Misma regla de reordenamiento para Argentina
                          # y Uruguay.
                          sorteos[k] = reordenar_columnas(raw[:20])

                          print(
                              f"{key_loteria} {k} OK "
                              f"{sorteos[k][:3]}... "
                              "-> reordenado"
                          )
                      else:
                          if (
                              guardado.get(k)
                              and len(guardado.get(k)) >= 10
                          ):
                              sorteos[k] = guardado[k]

                              print(
                                  f"{key_loteria} {k} "
                                  "falló, conservo guardado"
                              )

              except Exception as error:
                  print(f"Error {key_loteria}: {error}")

                  for k in orden:
                      if (
                          ya_deberia(k, tabla)
                          and viejo.get(key_loteria, {}).get(k)
                      ):
                          sorteos[k] = viejo[key_loteria][k]

              return sorteos

          resultados = {}

          for loteria in [
              "nacional",
              "provincia",
              "santafe",
              "cordoba",
              "entrerios"
          ]:
              resultados[loteria] = extraer(
                  "https://tujugada.com.ar",
                  ORDEN,
                  4,
                  loteria,
                  HORA
              )

          resultados["uruguay"] = extraer(
              "https://tujugada.com.ar/quiniela_uruguay.asp",
              ORDEN_UY,
              3,
              "uruguay",
              HORA_UY
          )

          salida = {
              "fecha": HOY,
              "fecha_arg": AHORA.strftime("%d/%m/%Y"),
              "completo": resultados,
              "ultima_actualizacion": AHORA.strftime(
                  "%d/%m/%Y %H:%M"
              )
          }

          with open(ARCHIVO, "w", encoding="utf-8") as archivo:
              json.dump(
                  salida,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )

          with open("quiniela.json", "w", encoding="utf-8") as archivo:
              json.dump(
                  salida,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "FINAL OK - Argentina y Uruguay "
              "extraídos y reordenados correctamente"
          )
          PY

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@infomdq.com"

          git add historial/ quiniela.json

          git commit -m "Actualizar quiniela Argentina y Uruguay" || true

          git push

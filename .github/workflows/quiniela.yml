name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os
          from datetime import datetime
          HEADERS = {"User-Agent": "Mozilla/5.0"}
          viejo = {}
          if os.path.exists("quiniela.json"):
              try:
                  with open("quiniela.json","r",encoding="utf-8") as f:
                      viejo = json.load(f).get("completo",{})
              except: pass
          def extraer(url):
              sorteos = {"previa":[],"primera":[],"matutina":[],"vespertina":[],"nocturna":[]}
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  html = r.text.lower()
                  for key in sorteos.keys():
                      idx = html.find(key)
                      if idx!=-1:
                          bloque = html[idx:idx+8000]
                          nums = re.findall(r'\b\d{4}\b', bloque)
                          nums = [n for n in nums if not n.startswith("202")]
                          tmp=[]
                          for n in nums:
                              if n not in tmp:
                                  tmp.append(n)
                              if len(tmp)>=20: break
                          if len(tmp)>=20:
                              sorteos[key]=tmp
              except: pass
              return sorteos
          LOTERIAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela-provincia.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela-santafe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela-cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela-entrerios.asp",
          }
          completo = {}
          for nom, url in LOTERIAS.items():
              nuevo = extraer(url)
              completo[nom] = {}
              for k in nuevo:
                  if nuevo[k]:
                      completo[nom][k] = nuevo[k]
                  else:
                      completo[nom][k] = viejo.get(nom,{}).get(k, [])
          try:
              r = requests.get("https://www.loteriasyquinielas.com.uy/quiniela/", headers=HEADERS, timeout=20)
              todos = re.findall(r'\b\d{3}\b', r.text)
              unicos=[]
              for n in todos:
                  if n not in unicos and n!="000":
                      unicos.append(n)
              if len(unicos)>=20:
                  completo["uruguay"] = {"vespertina": unicos[:20], "nocturna": unicos[20:40] if len(unicos)>=40 else unicos[:20]}
              else:
                  completo["uruguay"] = viejo.get("uruguay", {"vespertina":[],"nocturna":[]})
          except:
              completo["uruguay"] = viejo.get("uruguay", {"vespertina":[],"nocturna":[]})
          for lot in completo:
              for s in completo[lot]:
                  if not completo[lot][s]:
                      completo[lot][s] = viejo.get(lot,{}).get(s, ["0000"]*20 if lot!="uruguay" else ["000"]*20)
          output = {
              "actualizado": datetime.now().strftime("%d/%m/%Y %H:%M"),
              "completo": completo,
              "nacional": completo["nacional"]["nocturna"],
              "provincia": completo["provincia"]["nocturna"],
              "santafe": completo["santafe"]["nocturna"],
              "cordoba": completo["cordoba"]["nocturna"],
              "entrerios": completo["entrerios"]["nocturna"],
              "uruguay": completo["uruguay"]["nocturna"]
          }
          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Quiniela 5 sorteos + Uruguay 3 cifras"
          file_pattern: quiniela.json

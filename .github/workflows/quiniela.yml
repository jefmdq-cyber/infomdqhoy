name: Quiniela 20 V6 Final

on:
  schedule:
    - cron: '20 13 * * 1-6'
    - cron: '5 15 * * 1-6'
    - cron: '5 18 * * 1-6'
    - cron: '5 21 * * 1-6'
    - cron: '10 0 * * 0,2-6'
  workflow_dispatch:

concurrency:
  group: quiniela-v6
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear con ventana de atraso
        run: |
          pip install requests beautifulsoup4 lxml
          python - << 'PY'
          import requests, re, json, os, glob, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122","Referer":"https://www.google.com/"}
          TZ_ARG = ZoneInfo("America/Argentina/Buenos_Aires")
          AHORA = datetime.now(TZ_ARG)
          HOY = AHORA.strftime("%Y-%m-%d")

          if AHORA.weekday() == 6:
              print(f"Domingo {HOY} - sin sorteos")
              exit(0)

          DIAS_A_CONSERVAR = 30
          os.makedirs("historial", exist_ok=True)
          ARCHIVO_HOY = f"historial/{HOY}.json"

          LOTERIAS_4CIFRAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela_santa_fe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela_cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela_entre_rios.asp",
          }
          URUGUAY_URL = "https://www.tujugada.com.ar/quiniela_uruguay.asp"
          ORDEN_4CIFRAS = ["previa","primera","matutina","vespertina","nocturna"]
          ORDEN_URUGUAY = ["vespertina","nocturna"]

          def limpiar(html):
              return html.replace("---MENSAJE PARA EL VISITANTE DE ESTE SITIO--- SI VES ESTE MENSAJE ES PORQUE VISITAS UN SITIO QUE ESTA COPIANDO CODIGO FUENTE AUTORIA DE TUJUGADA.COM.AR SIN AUTORIZACION. VISITA AL SITIO REAL QUE ACTUALIZA ESTOS DATOS EN WWW.TUJUGADA.COM.AR!!!", "")

          def mismo_path(a,b):
              return urlparse(a).path.lower() == urlparse(b).path.lower()

          def texto_plano(h):
              soup = BeautifulSoup(limpiar(h), "lxml")
              for t in soup(["script","style"]): t.decompose()
              tx = soup.get_text(separator=" ")
              return re.sub(r'\s+', ' ', tx)

          def reordenar_columnas(l):
              if len(l) < 20: return l
              return l[0::2] + l[1::2]

          def extraer_sorteos(url, orden, digitos):
              sorteos = {k: [] for k in orden}
              patron = r'\b\d{%d}\b' % digitos
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30, allow_redirects=True)
                  if not mismo_path(url, r.url): return sorteos
                  low = texto_plano(r.text).lower()
                  for key in orden:
                      m = re.search(rf'\b{key}\b\s+\d{{1,2}}:\d{{2}}\s*hs\b', low)
                      if m:
                          trozo = low[m.start(): m.start()+1500]
                          nums = re.findall(patron, trozo)
                          uniq = []
                          for n in nums:
                              if n not in uniq: uniq.append(n)
                          if len(uniq) >= 15: sorteos[key] = reordenar_columnas(uniq[:20])
              except Exception as e:
                  print(f"Error {url}: {e}")
              return sorteos

          def get_sorteo_objetivo():
              h = AHORA.hour
              if h < 11: return "previa"
              if h < 13: return "primera"
              if h < 16: return "matutina"
              if h < 19: return "vespertina"
              return "nocturna"

          def esperar_resultados_completos_con_atraso():
              sorteo = get_sorteo_objetivo()
              print(f"Sorteo objetivo ART {AHORA.strftime('%H:%M')}: {sorteo}")
              viejo = {}
              if os.path.exists(ARCHIVO_HOY):
                  try: viejo = json.load(open(ARCHIVO_HOY,encoding="utf-8")).get("completo",{})
                  except: pass

              if viejo:
                  todas_previas = all(len(viejo.get(lot,{}).get(sorteo,[])) >= 20 for lot in LOTERIAS_4CIFRAS.keys())
                  if todas_previas:
                      print(f"Ya completo para {sorteo} -> exit")
                      return viejo

              intentos_seg = [0, 300, 600, 900, 900]
              completo_final = viejo if viejo else {lot: {k:[] for k in ORDEN_4CIFRAS} for lot in LOTERIAS_4CIFRAS}
              completo_final["uruguay"] = completo_final.get("uruguay", {k:[] for k in ORDEN_URUGUAY})

              for idx, sleep_sec in enumerate(intentos_seg):
                  if idx > 0:
                      print(f"Atraso, durmiendo {sleep_sec//60} min intento {idx+1}/5")
                      time.sleep(sleep_sec)
                  print(f"--- Intento {idx+1}/5 para {sorteo} ---")
                  nuevo = {}
                  for nombre, url in LOTERIAS_4CIFRAS.items():
                      nuevo[nombre] = extraer_sorteos(url, ORDEN_4CIFRAS, 4)
                  nuevo_uy = extraer_sorteos(URUGUAY_URL, ORDEN_URUGUAY, 3)

                  ok = True
                  for lot in LOTERIAS_4CIFRAS.keys():
                      cant = len(nuevo.get(lot,{}).get(sorteo,[]))
                      if cant < 20:
                          print(f" Falta {lot} {sorteo}: {cant}/20")
                          ok = False

                  if ok:
                      print(f"COMPLETO {sorteo}")
                      for lot in LOTERIAS_4CIFRAS.keys():
                          completo_final[lot][sorteo] = nuevo[lot][sorteo]
                      if sorteo in ORDEN_URUGUAY:
                          completo_final["uruguay"][sorteo] = nuevo_uy.get(sorteo,[])
                      return completo_final

              print(f"ATRASO EXTREMO {sorteo}")
              return completo_final

          resultado = esperar_resultados_completos_con_atraso()

          output = {"fecha": HOY, "actualizado": AHORA.strftime("%d/%m/%Y %H:%M"), "completo": resultado,
                    "nacional": resultado.get("nacional",{}).get("nocturna",[]),
                    "provincia": resultado.get("provincia",{}).get("nocturna",[]),
                    "santafe": resultado.get("santafe",{}).get("nocturna",[]),
                    "cordoba": resultado.get("cordoba",{}).get("nocturna",[]),
                    "entrerios": resultado.get("entrerios",{}).get("nocturna",[]),
                    "uruguay": resultado.get("uruguay",{}).get("nocturna",[])}

          with open(ARCHIVO_HOY,"w",encoding="utf-8") as f: json.dump(output,f,ensure_ascii=False,indent=2)
          with open("quiniela.json","w",encoding="utf-8") as f: json.dump(output,f,ensure_ascii=False,indent=2)

          limite = AHORA.date() - timedelta(days=DIAS_A_CONSERVAR)
          for ruta in glob.glob("historial/*.json"):
              try:
                  fa = datetime.strptime(os.path.basename(ruta).replace(".json",""), "%Y-%m-%d").date()
                  if fa < limite: os.remove(ruta)
              except: pass

          print(f"OK {HOY} - {get_sorteo_objetivo()}")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Actualizacion quiniela"
          file_pattern: 'quiniela.json historial/'

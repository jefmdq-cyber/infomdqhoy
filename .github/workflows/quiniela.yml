nombre : Quiniela 20 TODOS los sorteos
en :
  cronograma :
    # HORARIO ARG 10:00 a 23:00 = UTC 13:00 a 02:00
    # Cada 3 min SOLO cuando hay sorteos. Proyecto De noche no gasta.
    # Previa 10:15 ART=13:15 UTC, Primera 12:00 ART=15:00 UTC, Matutina 15:00 ART=18:00 UTC
    # Vespertina 18:00 ART=21:00 UTC, Nocturna 21:00 ART=00:00 UTC
    - cron : ' */3 13-15,17-23 * * * '
    - cron : ' */3 0-1 * * * '
  flujo_de_trabajo :

empleos :
  actualizar :
    se ejecuta en : ubuntu-latest
    permisos :
      Contenido : escribir
    pasos :
      - usos : actions/checkout@v6
      - usos : actions/setup-python@v6
        con :
          Versión de Python : ' 3.11 '
      - nombre : sorteos de Scrapear

name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear 20x5 sorteos
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json
          from bs4 import BeautifulSoup
          from datetime import datetime

          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122","Referer":"https://www.google.com/"}

          LOTERIAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela-provincia.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela-santafe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela-cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela-entrerios.asp",
          }

          def limpiar(html):
              return html.replace("---MENSAJE PARA EL VISITANTE DE ESTE SITIO--- SI VES ESTE MENSAJE ES PORQUE VISITAS UN SITIO QUE ESTA COPIANDO CODIGO FUENTE AUTORIA DE TUJUGADA.COM.AR SIN AUTORIZACION. VISITA AL SITIO REAL QUE ACTUALIZA ESTOS DATOS EN WWW.TUJUGADA.COM.AR!!!", "")

          def extraer_5_sorteos(url):
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  html = limpiar(r.text)
                  soup = BeautifulSoup(html, "lxml")
                  tablas = soup.find_all("table")
                  sorteos = {"previa":[],"primera":[],"matutina":[],"vespertina":[],"nocturna":[]}
                  orden = ["previa","primera","matutina","vespertina","nocturna"]
                  listas_20 = []
                  for t in tablas:
                      nums = re.findall(r'\b\d{4}\b', t.get_text())
                      nums = [n for n in nums if not n.startswith("202")]
                      if len(nums) >= 20:
                          listas_20.append(nums[:20])
                  if len(listas_20) >= 5:
                      for i, key in enumerate(orden):
                          if i < len(listas_20):
                              sorteos[key] = listas_20[i]
                  elif listas_20:
                      for k in sorteos:
                          sorteos[k] = listas_20[0]
                  print(f"{url} -> {len(listas_20)} sorteos")
                  return sorteos
              except Exception as e:
                  print(f"Error {url}: {e}")
                  return {"previa":[],"primera":[],"matutina":[],"vespertina":[],"nocturna":[]}

          completo = {}
          for nombre, url in LOTERIAS.items():
              completo[nombre] = extraer_5_sorteos(url)

          # URUGUAY CORREGIDO - SOLO 2 SORTEOS DE 3 CIFRAS
          try:
              r = requests.get("https://www.loteriasyquinielas.com.uy/quiniela/", headers=HEADERS, timeout=20)
              # Busca numeros de 3 cifras reales
              nums_uy_raw = re.findall(r'\b\d{3,4}\b', r.text)
              # Convierte todo a 3 cifras (si es 4 cifras, toma las ultimas 3)
              nums_uy = []
              for n in nums_uy_raw:
                  if len(n) == 4:
                      nums_uy.append(n[-3:]) # 2544 -> 544
                  elif len(n) == 3:
                      nums_uy.append(n)
                  if len(nums_uy) >= 40:
                      break

              print(f"Uruguay encontrados: {nums_uy[:5]}")

              if len(nums_uy) >= 20:
                  completo["uruguay"] = {
                      "vespertina": nums_uy[:20],
                      "nocturna": nums_uy[20:40] if len(nums_uy)>=40 else nums_uy[:20]
                  }
              else:
                  # Si no encuentra, deja vacio para no repetir
                  completo["uruguay"] = {"vespertina": [], "nocturna": []}
          except Exception as e:
              print(f"Error Uruguay: {e}")
              completo["uruguay"] = {"vespertina": [], "nocturna": []}

          # Evita JSON vacio - Argentina
          for lot in ["nacional","provincia","santafe","cordoba","entrerios"]:
              for sorteo in completo[lot]:
                  if not completo[lot][sorteo]:
                      completo[lot][sorteo] = ["0000"]*20

          # Evita JSON vacio - Uruguay 3 cifras
          for sorteo in completo["uruguay"]:
              if not completo["uruguay"][sorteo]:
                  completo["uruguay"][sorteo] = ["000"]*20

          output = {
              "actualizado": datetime.now().strftime("%d/%m/%Y %H:%M"),
              "completo": completo,
              "nacional": completo["nacional"]["nocturna"],
              "provincia": completo["provincia"]["nocturna"],
              "santafe": completo["santafe"]["nocturna"],
              "cordoba": completo["cordoba"]["nocturna"],
              "entrerios": completo["entrerios"]["nocturna"],
              "uruguay": completo["uruguay"]["nocturna"]
          }

          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print("OK JSON corregido Uruguay 3 cifras")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix Uruguay 3 cifras 2 sorteos"
          file_pattern: quiniela.json

name: Quiniela 20 FIX real
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear real
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os
          from datetime import datetime, timedelta, timezone
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0"}
          LOTERIAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela_santa_fe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela_cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela_entre_rios.asp",
            "uruguay": "https://www.tujugada.com.ar/quiniela_uruguay.asp",
          }
          ORDEN = ["previa","primera","matutina","vespertina","nocturna"]
          zona = timezone(timedelta(hours=-3))
          hoy = datetime.now(zona)
          dia = hoy.day
          mes = hoy.month
          print(f"Hoy {dia}/{mes}/{hoy.year} {hoy.strftime('%H:%M')}")
          def extraer(url, digitos):
              res = {k: [] for k in ORDEN}
              try:
                  r = requests.get(url, headers=HEADERS, timeout=40)
                  html = r.text
                  # saco el cartel anti-copia que rompe todo
                  html = re.sub(r'---MENSAJE.*?WWW\.TUJUGADA\.COM\.AR!!!', '', html, flags=re.I|re.S)
                  # busco cada sorteo: 15/9/2026 - Matutina
                  for m in re.finditer(r'(\d{1,2}/\d{1,2}/\d{4})\s*-\s*(Previa|Primera|Matutina|Vespertina|Nocturna)', html, re.I):
                      fecha_str = m.group(1)
                      sorteo = m.group(2).lower()
                      d,mo,y = map(int, re.split(r'[/]', fecha_str))
                      if d!=dia or mo!=mes:
                          continue
                      trozo = html[m.end():m.end()+6000]
                      nums = re.findall(rf'\b\d{{{digitos}}}\b', trozo)
                      # limpio duplicados manteniendo orden y saco años tipo 2026
                      uniq=[]
                      for n in nums:
                          if n==str(y): continue
                          if n not in uniq: uniq.append(n)
                          if len(uniq)>=20: break
                      if len(uniq)>=10:
                          res[sorteo]=uniq[:20]
                          print(f"OK {url} {sorteo} {uniq[0]}")
              except Exception as e:
                  print(f"ERR {url} {e}")
              return res
          completo={}
          for k,u in LOTERIAS.items():
              dig = 3 if k=="uruguay" else 4
              completo[k]=extraer(u, dig)
          # Uruguay solo tiene vespertina/nocturna pero lo guardamos igual
          out={
            "actualizado": hoy.strftime("%d/%m/%Y %H:%M"),
            "fecha": hoy.strftime("%Y-%m-%d"),
            "completo": completo,
            "nacional": completo["nacional"].get("nocturna",[]),
            "provincia": completo["provincia"].get("nocturna",[]),
            "santafe": completo["santafe"].get("nocturna",[]),
            "cordoba": completo["cordoba"].get("nocturna",[]),
            "entrerios": completo["entrerios"].get("nocturna",[]),
            "uruguay": completo["uruguay"].get("nocturna",[])
          }
          # Si es antes de las 21:15 forzamos nocturna vacia para no mostrar ayer
          if hoy.hour < 21 or (hoy.hour==21 and hoy.minute<15):
              for k in completo:
                  completo[k]["nocturna"]=[]
          with open("quiniela.json","w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          os.makedirs("historial", exist_ok=True)
          with open(f"historial/{hoy.strftime('%Y-%m-%d')}.json","w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix real sin cartel anti copia"
          file_pattern: |
            quiniela.json
            historial/*.json

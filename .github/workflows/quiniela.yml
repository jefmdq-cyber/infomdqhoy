name: Actualizar quiniela
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Actualizar
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import json, re, requests
          from datetime import datetime
          from bs4 import BeautifulSoup
          try:
              r = requests.get("https://www.dejugadas.com/quiniela-hoy-resultados-todas", headers={"User-Agent":"Mozilla/5.0"}, timeout=20)
              soup = BeautifulSoup(r.text, "html.parser")
              texto = soup.get_text(" ", strip=True)
              res = {}
              for n, num in re.findall(r'(Nacional|Provincia|Buenos Aires|Santa Fe|Cordoba|Entre Rios)\s+(\d{3,4})', texto, re.I):
                  res[n.title()] = num
              data = {"actualizado": datetime.now().strftime("%d/%m %H:%M"), "resultados": res}
          except:
              data = {"actualizado": datetime.now().strftime("%d/%m %H:%M"), "resultados": {"Nacional":"0000"}}
          json.dump(data, open("quiniela.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          git config user.name "robot"
          git config user.email "robot@bot.com"
          git add quiniela.json
          git commit -m "auto" || echo "sin cambios"
          git push

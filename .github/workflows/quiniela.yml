name: Actualizar quiniela completa con Uruguay
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import json, re, requests, os
          from datetime import datetime
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent":"Mozilla/5.0"}
          final = {}

          # Cargar viejo para no borrar si no hay sorteo
          if os.path.exists("quiniela.json"):
              try:
                  old = json.load(open("quiniela.json", encoding="utf-8"))
                  final = old.get("resultados", old)
              except: pass

          def get_cabeza(url):
              try:
                  r = requests.get(url, headers=HEADERS, timeout=20)
                  soup = BeautifulSoup(r.text, "lxml")
                  txt = soup.get_text(" ", strip=True)
                  m = re.search(r'Cabeza[^\d]{0,20}(\d{3,4})', txt, re.I)
                  if not m:
                      m = re.search(r'ganador[^\d]{0,20}(\d{3,4})', txt, re.I)
                  if not m:
                      m = re.search(r'\b1°\b[^\d]{0,20}(\d{4})', txt)
                  return m.group(1) if m else None
              except: return None

          # 1. ARGENTINA - Provincia y Ciudad
          prov = get_cabeza("https://www.lanacion.com.ar/loterias/quiniela-provincia-ultimo-sorteo")
          ciud = get_cabeza("https://www.lanacion.com.ar/loterias/quiniela-ciudad-ultimo-sorteo")
          
          if prov:
              if "Provincia" not in final: final["Provincia"] = {}
              final["Provincia"]["Nocturna"] = prov
              print(f"Provincia: {prov}")
          if ciud:
              if "Ciudad" not in final: final["Ciudad"] = {}
              final["Ciudad"]["Nocturna"] = ciud
              print(f"Ciudad: {ciud}")

          # 2. URUGUAY - La Banca Montevideo
          # Fuente: La Nacion AR ya trae la uruguaya y Cronista
          uru_noct = get_cabeza("https://www.lanacion.com.ar/loterias/quiniela-uruguaya-ronda-nocturna-de-hoy")
          uru_vesp = get_cabeza("https://www.lanacion.com.ar/loterias/quiniela-uruguaya-ronda-vespertina-de-hoy")

          if "Uruguay" not in final: final["Uruguay"] = {}

          if uru_noct:
              final["Uruguay"]["Nocturna"] = uru_noct
              print(f"Uruguay Nocturna: {uru_noct}")
          if uru_vesp:
              final["Uruguay"]["Vespertina"] = uru_vesp
              print(f"Uruguay Vespertina: {uru_vesp}")

          # Si no encontró Uruguay en La Nacion, prueba debate.com.uy que es la oficial
          if "Nocturna" not in final.get("Uruguay", {}):
              try:
                  r = requests.get("https://www.debate.com.uy/resultados-quiniela", headers=HEADERS, timeout=20)
                  soup = BeautifulSoup(r.text, "lxml")
                  txt = soup.get_text(" ", strip=True)
                  m = re.search(r'01\.(\d{3})', txt)
                  if m:
                      final["Uruguay"]["Nocturna"] = m.group(1)
              except: pass

          data = {"actualizado": datetime.now().strftime("%d/%m %H:%M"), "resultados": final}
          json.dump(data, open("quiniela.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("FINAL:", data)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto quiniela + uruguay"
          file_pattern: quiniela.json

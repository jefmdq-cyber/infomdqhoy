name: Actualiza Quiniela cada 15 min
on:
  schedule:
    - cron: '30,45 13 * * *'
    - cron: '0,15,30 14 * * *'
    - cron: '0,15,30,45 15 * * *'
    - cron: '0 16 * * *'
    - cron: '30,45 17 * * *'
    - cron: '0,15,30 18 * * *'
    - cron: '30,45 20 * * *'
    - cron: '0,15,30 21 * * *'
    - cron: '0,15,30,45 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: |
          python - << 'PY'
          import requests, re, json
          from bs4 import BeautifulSoup
          from datetime import datetime
          import pytz

          url = "https://www.jugandoonline.com.ar/SorteosQuiniela3.aspx"
          html = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text
          soup = BeautifulSoup(html, "lxml")
          texto = soup.get_text(" ", strip=True)

          def sacar_numeros(bloque):
              # saca 20 numeros de 3 o 4 cifras
              nums = re.findall(r'\b\d{3,4}\b', bloque)
              # filtrar los puestos 1..20 que aparecen como 1,2,3... nos quedamos con los de 3-4 cifras
              # los primeros 20 de 4 cifras son los buenos
              res = []
              for n in nums:
                  if len(n) >= 3:
                      # evitar que tome el horario 10:30 como numero
                      if n not in ["10","30","12","00","14","15","18","20","21"]:
                          res.append(n.zfill(4))
                  if len(res) == 20:
                      break
              return res

          def extraer(ciudad_pat, turno_pat):
              # busca "Ciudad.*Previa" y toma los siguientes 1000 caracteres
              pat = rf"{ciudad_pat}.*?{turno_pat}.*?"
              m = re.search(pat, texto, re.I)
              if not m:
                  return []
              inicio = m.end()
              bloque = texto[inicio:inicio+2000]
              return sacar_numeros(bloque)

          with open("quiniela.json","r",encoding="utf-8") as f:
              viejo = json.load(f)

          nuevo = {}
          # Ciudad = Nacional
          nuevo["nacional_previa"] = extraer(r"Ciudad", r"Previa")
          nuevo["nacional_primera"] = extraer(r"Ciudad", r"La Primera")
          nuevo["nacional_matutina"] = extraer(r"Ciudad", r"Matutina")
          nuevo["nacional_vespertina"] = extraer(r"Ciudad", r"Vespertina")
          nuevo["nacional_nocturna"] = extraer(r"Ciudad", r"Nocturna")

          # Provincia
          nuevo["provincia_previa"] = extraer(r"Prov.*?Bs.*?As", r"Previa")
          nuevo["provincia_primera"] = extraer(r"Prov.*?Bs.*?As", r"La Primera")
          nuevo["provincia_matutina"] = extraer(r"Prov.*?Bs.*?As", r"Matutina")
          nuevo["provincia_vespertina"] = extraer(r"Prov.*?Bs.*?As", r"Vespertina")
          nuevo["provincia_nocturna"] = extraer(r"Prov.*?Bs.*?As", r"Nocturna")

          tz = pytz.timezone("America/Argentina/Buenos_Aires")
          ahora = datetime.now(tz)

          viejo["fecha"] = ahora.strftime("%d/%m/%Y")
          viejo["actualizado"] = ahora.strftime("%H:%M")

          # solo pisar si encontró algo
          for k,v in nuevo.items():
              if v and len(v) >= 5:
                  viejo[k] = v
                  print(f"OK {k}: {v[0]}")

          # compatibilidad con tu indice.html que usa "nacional" y "provincia"
          for turno in ["nocturna","vespertina","matutina","primera","previa"]:
              if viejo.get(f"nacional_{turno}"):
                  viejo["nacional"] = viejo[f"nacional_{turno}"]
                  viejo["provincia"] = viejo.get(f"provincia_{turno}", viejo.get("provincia"))
                  break

          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(viejo, f, ensure_ascii=False, indent=2)

          print("JSON guardado")
          PY
      - run: |
          pip install pytz
      - run: |
          git config user.name "robot-quiniela"
          git config user.email "robot@infomdq.com"
          git add quiniela.json
          git commit -m "quiniela auto" || echo "sin cambios"
          git push

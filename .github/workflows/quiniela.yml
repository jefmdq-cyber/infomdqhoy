name: Quiniela 20 TODOS los sorteos
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrapear sorteos
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import requests, re, json, os
          from datetime import datetime, timedelta, timezone
          from bs4 import BeautifulSoup

          HEADERS = {"User-Agent": "Mozilla/5.0 Chrome/122", "Cache-Control": "no-cache"}
          LOTERIAS = {
            "nacional": "https://www.tujugada.com.ar/quiniela-nacional.asp",
            "provincia": "https://www.tujugada.com.ar/quiniela_provincia_buenos_aires.asp",
            "santafe": "https://www.tujugada.com.ar/quiniela_santa_fe.asp",
            "cordoba": "https://www.tujugada.com.ar/quiniela_cordoba.asp",
            "entrerios": "https://www.tujugada.com.ar/quiniela_entre_rios.asp",
          }
          ORDEN = ["previa","primera","matutina","vespertina","nocturna"]
          URL_UY = "https://www.tujugada.com.ar/quiniela_uruguay.asp"
          ORDEN_UY = ["vespertina","nocturna"]

          zona = timezone(timedelta(hours=-3))
          hoy = datetime.now(zona)
          fecha_iso = hoy.strftime("%Y-%m-%d")
          # Genera variantes de fecha de hoy para comparar
          variantes_hoy = [
            f"{hoy.day}/{hoy.month}/{hoy.year}", # 15/9/2026
            f"{hoy.day:02d}/{hoy.month:02d}/{hoy.year}", # 15/09/2026
            f"{hoy.day}/{hoy.month:02d}/{hoy.year}", # 15/09/2026
            f"{hoy.day:02d}/{hoy.month}/{hoy.year}", # 15/9/2026
          ]

          def extraer(url, orden, digitos):
              res = {k: [] for k in orden}
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  soup = BeautifulSoup(r.text, "lxml")
                  texto = soup.get_text(" ", strip=True)
                  texto_low = texto.lower()

                  # Busca todos los bloques tipo "14/9/2026 - Nocturna 21:00"
                  # Captura fecha y sorteo
                  patron = re.compile(r'(\d{1,2}/\d{1,2}/\d{2,4})\s*-\s*(previa|primera|matutina|vespertina|nocturna)\s+\d{1,2}:\d{2}', re.I)
                  matches = list(patron.finditer(texto))

                  # Ordena por posicion
                  for i, m in enumerate(matches):
                      fecha_txt = m.group(1)
                      sorteo_txt = m.group(2).lower()
                      if sorteo_txt not in orden:
                          continue
                      # NORMALIZA fecha a 4 digitos año
                      if len(fecha_txt.split('/')[-1]) == 2:
                          d,m2,y = fecha_txt.split('/')
                          fecha_txt = f"{d}/{m2}/20{y}"

                      # ES DE HOY?
                      es_hoy = any(fecha_txt == v or fecha_txt.replace('/0','/') == v.replace('/0','/') for v in variantes_hoy) or (f"{hoy.day}/{hoy.month}" in fecha_txt and str(hoy.year) in fecha_txt)

                      if not es_hoy:
                          continue # <--- ACA IGNORA LOS DE AYER COMO EL 0535 del 14/9

                      inicio = m.start()
                      fin = matches[i+1].start() if i+1 < len(matches) else inicio+4000
                      trozo = texto[inicio:fin]

                      nums = re.findall(rf'\b\d{{{digitos}}}\b', trozo)
                      nums = [n for n in nums if not n.startswith("20")] # saca años
                      uniq = []
                      for n in nums:
                          if n not in uniq:
                              uniq.append(n)

                      if len(uniq) >= 10:
                          res[sorteo_txt] = uniq[:20]

                  print(f"{url} HOY {variantes_hoy[0]} -> {res}")
              except Exception as e:
                  print(f"Error {url}: {e}")
              return res

          completo = {}
          for nombre, url in LOTERIAS.items():
              completo[nombre] = extraer(url, ORDEN, 4)
          completo["uruguay"] = extraer(URL_UY, ORDEN_UY, 3)

          output = {
              "actualizado": hoy.strftime("%d/%m/%Y %H:%M"),
              "fecha": fecha_iso,
              "completo": completo,
              "nacional": completo["nacional"].get("nocturna",[]),
              "provincia": completo["provincia"].get("nocturna",[]),
              "santafe": completo["santafe"].get("nocturna",[]),
              "cordoba": completo["cordoba"].get("nocturna",[]),
              "entrerios": completo["entrerios"].get("nocturna",[]),
              "uruguay": completo["uruguay"].get("nocturna",[]),
          }

          with open("quiniela.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          os.makedirs("historial", exist_ok=True)
          with open(f"historial/{fecha_iso}.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          print(f"OK GENERADO {fecha_iso}")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: solo fecha de hoy, no mas numeros de ayer"
          file_pattern: |
            quiniela.json
            historial/*.json

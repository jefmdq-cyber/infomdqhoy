          con open("quiniela.json","w",encoding="utf-8") como f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          limite = AHORA.date() - timedelta(dias=DIAS_A_CONSERVAR)
          para ruta en glob.glob("historial/*.json"):
              nombre = os.path.basename(ruta).replace(".json","")
              intentar:
                  fecha_archivo = datetime.strptime(nombre, "%Y-%m-%d").date()
                  si fecha_archivo < límite:
                      os.remove(ruta)
                      print(f"Borrado por antigüedad: {ruta}")
              excepto ValueError:
                  aprobar
          print(f"OK JSON generado para {HOY} (historial + quiniela.json)")

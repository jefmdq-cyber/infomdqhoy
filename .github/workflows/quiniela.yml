name: Actualizar quiniela
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar
        run: |
          pip install requests beautifulsoup4 lxml
          python << 'PY'
          import json, re, requests
          from datetime import datetime
          from bs4 import BeautifulSoup

          resultados = {}
          def buscar_fuente(url):
              try:
                  r = requests.get(url, headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}, timeout=20)
                  txt = BeautifulSoup(r.text, "html.parser").get_text(" ", strip=True)
                  # Busca tipo: "Nacional... 9085" aunque haya texto en medio
                  patrones = {
                      "Nacional": r'Nacional[^0-9]{0,80}(\d{3,4})',
                      "Provincia": r'Provincia[^0-9]{0,80}(\d{3,4})',
                      "Cordoba": r'Cordoba[^0-9]{0,80}(\d{3,4})',
                      "Santa Fe": r'Santa Fe[^0-9]{0,80}(\d{3,4})',
                      "Entre Rios": r'Entre Rios[^0-9]{0,80}(\d{3,4})',
                      "Buenos Aires": r'Buenos Aires[^0-9]{0,80}(\d{3,4})'
                  }
                  for nombre, pat in patrones.items():
                      m = re.search(pat, txt, re.I)
                      if m and nombre not in resultados:
                          resultados[nombre] = m.group(1)
              except Exception as e:
                  print(f"fallo {url}: {e}")

          # Probamos 2 fuentes
          buscar_fuente("https://www.dejugadas.com/quiniela-hoy-resultados-todas")
          buscar_fuente("https://www.clarin.com/loterias-y-quinielas")

          if not resultados:
              resultados = {"Nacional": "0000", "Provincia": "0000"}

          data = {"actualizado": datetime.now().strftime("%d/%m %H:%M"), "resultados": resultados}
          json.dump(data, open("quiniela.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print(data)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto quiniela"
          file_pattern: quiniela.json

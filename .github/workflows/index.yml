name: Run Google Indexing API

on:
  workflow_dispatch:# O la rama principal de tu repositorio

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth requests

      - name: Run Indexing Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python -c '
          import os
          import json
          from google.oauth2 import service_account
          import google.auth.transport.requests
          import requests

          # Cargar credenciales desde el secreto de GitHub
          creds_json = os.environ["GOOGLE_CREDENTIALS"]
          creds_dict = json.loads(creds_json)

          SCOPES = ["https://www.googleapis.com/auth/indexing"]
          credentials = service_account.Credentials.from_service_account_info(
              creds_dict, scopes=SCOPES
          )
          request = google.auth.transport.requests.Request()
          credentials.refresh(request)

          # URL de ejemplo que querés enviar a indexar (puedes adaptarla o automatizarla)
          url_to_index = "https://infomdqhoy.pages.dev/" 

          endpoint = "https://indexing.googleapis.com/v3/urlNotifications:publish"
          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {credentials.token}"
          }
          body = {
              "url": url_to_index,
              "type": "URL_UPDATED"
          }

          response = requests.post(endpoint, headers=headers, json=body)
          print(f"Status Code: {response.status_code}")
          print(response.text)
          '

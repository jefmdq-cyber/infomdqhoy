name: Indexar sitio en Google

on:
  workflow_dispatch:

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth requests

      - name: Run Indexing Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python -c '
          import os, json, requests, xml.etree.ElementTree as ET
          from google.oauth2 import service_account
          import google.auth.transport.requests

          # 1. Cargar credenciales
          creds_dict = json.loads(os.environ["GOOGLE_CREDENTIALS"])
          SCOPES = ["https://www.googleapis.com/auth/indexing"]
          credentials = service_account.Credentials.from_service_account_info(creds_dict, scopes=SCOPES)
          credentials.refresh(google.auth.transport.requests.Request())

          # 2. Leer tu sitemap.xml del repo
          tree = ET.parse("sitemap.xml")
          ns = {"ns": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [elem.text for elem in tree.findall(".//ns:loc", ns)]

          endpoint = "https://indexing.googleapis.com/v3/urlNotifications:publish"
          headers = {"Content-Type": "application/json", "Authorization": f"Bearer {credentials.token}"}

          # 3. Enviar cada URL
          for url in urls:
              body = {"url": url, "type": "URL_UPDATED"}
              r = requests.post(endpoint, headers=headers, json=body)
              print(f"{url} -> {r.status_code} - {r.text}")
          '

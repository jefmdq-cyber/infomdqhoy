<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrios del Sur | INFO MDQ HOY</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700;800&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1816;color:#fafaf9;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.top-bar{background:#12100f;border-bottom:1px solid #2a2520;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.top-bar .logo{font-family:'Fredoka',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px}
.top-bar .logo span{color:#facc15}
.top-bar .back{background:#2a2520;border:1px solid #44403c;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:800;color:#e7e5e4}
.container{max-width:760px;margin:0 auto;padding:16px;flex:1;width:100%}
h1{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:800}
.sub{color:#a8a29e;font-size:13px;margin-top:6px}
.q-card{background:#292524;border-radius:24px;border:1px solid #44403c;overflow:hidden;margin-top:18px}
.q-header{padding:20px}
.q-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px;background:#1c1917;padding:8px;border-radius:16px;border:1px solid #44403c}
.q-tab{padding:14px 6px;border-radius:12px;font-size:12px;font-weight:900;text-align:center;color:#a8a29e;cursor:pointer;text-transform:uppercase;background:#292524;border:1px solid #44403c}
.q-tab.active{background:linear-gradient(135deg,#facc15,#f59e0b);color:#422006;border-color:#facc15}
.q-detail{padding:0 20px 20px}
.q-detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;background:#2a2520;border:1px solid #facc15;padding:12px 16px;border-radius:14px}
.footer-final{margin-top:auto;text-align:center;padding:32px 20px 24px 20px;border-top:1px solid #2a2520;background:#12100f}
.footer-links{display:flex;justify-content:center;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.footer-links a{color:#e7e5e4;text-decoration:none;font-size:13px;font-weight:700;border:1px solid #44403c;background:#1c1917;padding:8px 14px;border-radius:999px}
</style>

<style>
/* FIX QUIRÚRGICO PARA KIOSCO LOS MELLI Y AVISOS QUE SE CORTAN A LA DERECHA */
#contenedor-barrios{
  overflow: hidden;
  width: 100%;
  box-sizing: border-box;
}
#contenedor-barrios > div[id^="contenedor-aviso-"],
#contenedor-barrios > div#contenedor-todos-los-avisos{
  max-width: 100% !important;
  width: 100% !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  padding-left: 0 !important;
  padding-right: 0 !important;
  box-sizing: border-box !important;
}
#contenedor-barrios > div[id^="contenedor-aviso-"] > div,
#contenedor-barrios > div#contenedor-todos-los-avisos > div{
  max-width: 100% !important;
  width: 100% !important;
  margin: 0 auto 20px auto !important;
  box-sizing: border-box !important;
}
/* El grid de 2 columnas de Melli en pantallas chicas se rompe, lo hacemos responsive */
#contenedor-barrios div[style*="grid-template-columns:1fr 1fr"]{
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
}
@media (max-width: 380px){
  #contenedor-barrios div[style*="grid-template-columns:1fr 1fr"]{
    grid-template-columns: 1fr !important;
  }
}
</style>

</head>
<body>
<div class="top-bar">
  <div style="display:flex;align-items:center;gap:10px"><div class="logo">INFO <span>MDQ HOY</span></div></div>
  <a href="./index.html" class="back">← Inicio</a>
</div>

<div class="container">
  <h1>Barrios del Sur</h1>
  <div class="sub">Los avisos completos, filtrados por barrio.</div>
  <div class="q-card">
    <div class="q-header">
      <div class="q-tabs">
        <div class="q-tab active" onclick="cambiarBarrio('alfar',this)">Alfar</div>
        <div class="q-tab" onclick="cambiarBarrio('acantilados',this)">Acantilados</div>
        <div class="q-tab" onclick="cambiarBarrio('faro',this)">Faro</div>
        <div class="q-tab" onclick="cambiarBarrio('serena',this)">Serena</div>
        <div class="q-tab" onclick="cambiarBarrio('estacion-chapadmalal',this)">Est. Chapadmalal</div>
        <div class="q-tab" onclick="cambiarBarrio('chapadmalal',this)">Chapadmalal</div>
      </div>
    </div>
    <div class="q-detail">
      <div class="q-detail-head">
        <b id="barrio-titulo">ALFAR</b>
        <span id="barrio-estado">Cargando...</span>
      </div>
      <div id="contenedor-barrios"></div>
    </div>
  </div>
</div>

<footer class="footer-final">
  <div class="footer-links">
    <a href="contacto.html">Contacto</a>
    <a href="terminos.html">Términos y Condiciones</a>
    <a href="privacidad.html">Privacidad</a>
  </div>
  <p style="font-size:11px;color:#57534e">&copy; 2026 INFO MDQ HOY - Mar del Plata</p>
</footer>

<script src="avisos.js"></script>
<script src="aviso-yr-soluciones.js"></script>
<script>
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'-'); }

const MAPEO = {
  'farmacia-vara': ['alfar'],
  'amapolas-dietetica': ['alfar'],
  'amapola': ['alfar'],
  'yr-soluciones': ['estacion-chapadmalal','chapadmalal'],
  'lavanderia-de-nannin': ['alfar'],
  'kiosco-los-melli': ['alfar'],
  'proveeduria-kevin': ['alfar','acantilados']
};

function getBarrios(div){
  let idReal = '';
  const inner = div.querySelector('[id]');
  if(inner && inner.id) idReal = norm(inner.id);
  const contId = norm(div.id);
  let clave = idReal || contId;

  for(let k in MAPEO){
    if(clave.indexOf(k) !== -1) return MAPEO[k];
  }
  // fallback por si el ID viene con guiones raros
  if(clave.indexOf('farmacia-vara') !== -1) return ['alfar'];
  if(clave.indexOf('amapolas') !== -1) return ['alfar'];
  if(clave.indexOf('melli') !== -1) return ['alfar'];
  if(clave.indexOf('nannin') !== -1 || clave.indexOf('lavanderia') !== -1) return ['alfar'];
  if(clave.indexOf('kevin') !== -1) return ['alfar','acantilados'];
  return [];
}

let barrioActual='alfar';

function cambiarBarrio(barrio, el){
  document.querySelectorAll('.q-tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  barrioActual=barrio;
  document.getElementById('barrio-titulo').innerText=barrio.toUpperCase();
  aplicarFiltro();
}

function aplicarFiltro(){
  const cont = document.getElementById('contenedor-barrios');
  // Atrapar TODO lo que avisos.js tira al body, incluido contenedor-todos-los-avisos donde está Farmacia Vara
  document.querySelectorAll('div[id^="contenedor-aviso-"], div#contenedor-todos-los-avisos').forEach(function(d){
    if(d.parentElement !== cont && !cont.contains(d)){
      cont.appendChild(d);
    }
  });

  let visibles=0;
  Array.from(cont.children).forEach(function(div){
    let esAviso = div.id.indexOf('contenedor-aviso-') === 0 || div.id === 'contenedor-todos-los-avisos';
    if(!esAviso) return;
    let barrios = getBarrios(div);
    if(barrios.length===0){
      div.style.display='none';
      return;
    }
    if(barrios.indexOf(barrioActual) !== -1){
      div.style.display='';
      visibles++;
    } else {
      div.style.display='none';
    }
  });
  document.getElementById('barrio-estado').innerText=visibles+' comercios';
}

const observer = new MutationObserver(function(){ aplicarFiltro(); });
observer.observe(document.body, {childList:true});

// Fix extra para Melli: forzar max-width 100% después de render
function fixMelliWidth(){
  document.querySelectorAll('#contenedor-barrios div[id^="contenedor-aviso-"] > div').forEach(function(card){
    card.style.maxWidth='100%';
    card.style.width='100%';
    card.style.marginLeft='0';
    card.style.marginRight='0';
    card.style.boxSizing='border-box';
  });
}
setInterval(function(){ aplicarFiltro(); fixMelliWidth(); }, 1000);

window.addEventListener('load', function(){ setTimeout(aplicarFiltro, 800); setTimeout(aplicarFiltro, 2500); setTimeout(aplicarFiltro, 4000); });
</script>
</body>
</html>
